info:
  name: '113 Cleanup · the audit records of the deleted elements remain'
  type: http
  seq: 113
http:
  method: GET
  url: '{{baseUrl}}/audit-log?applicationId={{audAppId}}&action=DELETE&pageSize=100'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the deletions of the run are recorded, with the old value", function () { const labels = res.body.data.map(function (e) { return e.entityLabel; }); const p = bru.getVar("audPrefix"); [p + "Tmp", p + "Dev", p + "Adm", p + "Col", p + "Scr"].forEach(function (l) { expect(labels, l).to.include(l); }); res.body.data.forEach(function (e) { expect(e.newValue).to.equal(null); expect(e.oldValue).to.be.an("object"); }); });
        test("the history before the cleanup is still there", function () { expect(res.body.total).to.be.at.least(5); });
settings:
  encodeUrl: true
