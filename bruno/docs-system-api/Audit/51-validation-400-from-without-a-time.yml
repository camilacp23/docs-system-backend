info:
  name: '51 Validation · 400 from without a time'
  type: http
  seq: 51
http:
  method: GET
  url: '{{baseUrl}}/audit-log?from=2026-11-01'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields).to.have.length(1); });
        test("the field is from with rule format", function () { expect(res.body.details.fields[0].field).to.equal("from"); expect(res.body.details.fields[0].rule).to.equal("format"); });
settings:
  encodeUrl: true
