info:
  name: '24 Administrator · 200 the history of one variable (create, update)'
  type: http
  seq: 24
http:
  method: GET
  url: '{{baseUrl}}/audit-log?entityType=variable&entityId={{audVarAdmId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data.length > 0) { const at = res.body.data[0].createdAt; bru.setVar("audStamp", at); bru.setVar("audStampId", res.body.data[0].id); bru.setVar("audStampPlus", new Date(Date.parse(at) + 1).toISOString()); bru.setVar("audStampMinus", new Date(Date.parse(at) - 1).toISOString()); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("an update and a creation, the update first", function () { expect(res.body.total).to.equal(2); expect(res.body.data.map(function (e) { return e.action; })).to.deep.equal(["UPDATE", "CREATE"]); });
        test("the update has the actor, the changed field and the old and new values", function () { const u = res.body.data[0]; expect(u.actor).to.deep.equal({ id: bru.getVar("audAdminId"), name: u.actor.name }); expect(u.entityLabel).to.equal(bru.getVar("audPrefix") + "Adm"); expect(u.changedFields).to.deep.equal(["description"]); expect(u.oldValue.description).to.equal(null); expect(u.newValue.description).to.equal("audited change"); expect(u.newValue.dataType).to.equal("TEXT"); expect(u.dbRole).to.equal("docs_app"); });
        test("the creation has only the new value", function () { const c = res.body.data[1]; expect(c.oldValue).to.equal(null); expect(c.newValue.name).to.equal(bru.getVar("audPrefix") + "Adm"); expect(c.changedFields).to.deep.equal([]); });
settings:
  encodeUrl: true
