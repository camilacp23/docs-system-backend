info:
  name: '28 Administrator · 200 a password change shows the field and no value'
  type: http
  seq: 28
http:
  method: GET
  url: '{{baseUrl}}/audit-log?entityType=app_user&entityId={{audTargetId}}&action=UPDATE'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("passwordHash is a changed field", function () { expect(res.body.total).to.equal(1); expect(res.body.data[0].changedFields).to.include("passwordHash"); });
        test("passwordHash has no key and no value in the response", function () { const e = res.body.data[0]; expect(Object.keys(e.oldValue)).to.not.include("passwordHash"); expect(Object.keys(e.newValue)).to.not.include("passwordHash"); expect(JSON.stringify(res.body)).to.not.include("$2"); });
settings:
  encodeUrl: true
