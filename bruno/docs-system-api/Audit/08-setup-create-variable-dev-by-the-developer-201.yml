info:
  name: '08 Setup · create variable Dev (by the Developer) 201'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{audDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{audAppId}},
        "name": "{{audPrefix}}Dev",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("audVarDevId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("audVarDevId")).to.be.a("number"); });
settings:
  encodeUrl: true
