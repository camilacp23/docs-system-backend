info:
  name: '21 Access · 403 Reader'
  type: http
  seq: 21
http:
  method: GET
  url: '{{baseUrl}}/audit-log?applicationId={{audAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{audReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("error body has code FORBIDDEN, message and details", function () { expect(res.body.code).to.equal("FORBIDDEN"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("Your role doesn't allow this action."); expect(res.body.details).to.deep.equal({ requiredRoles: ["ADMINISTRATOR", "DEVELOPER"] }); });
settings:
  encodeUrl: true
