info:
  name: '29 Administrator · 200 from and to are inclusive to the millisecond'
  type: http
  seq: 29
http:
  method: GET
  url: '{{baseUrl}}/audit-log?entityType=variable&entityId={{audVarAdmId}}&from={{audStamp}}&to={{audStamp}}'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the record whose instant is both limits is in", function () { expect(res.body.data.map(function (e) { return e.id; })).to.include(bru.getVar("audStampId")); });
settings:
  encodeUrl: true
