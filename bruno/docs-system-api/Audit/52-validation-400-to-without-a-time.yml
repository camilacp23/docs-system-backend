info:
  name: '52 Validation · 400 to without a time'
  type: http
  seq: 52
http:
  method: GET
  url: '{{baseUrl}}/audit-log?to=2026-11-01'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("the field is to with rule format", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.details.fields[0].field).to.equal("to"); expect(res.body.details.fields[0].rule).to.equal("format"); });
settings:
  encodeUrl: true
