info:
  name: '01 Setup · administrator login 200'
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        let run = Math.random().toString(36).slice(2, 10);
        try {
          if (res.status === 200) { bru.setVar("audAdminToken", res.body.data.accessToken); bru.setVar("audAdminId", res.body.data.user.id); }
        } finally {
          bru.setVar("audRun", run);
          bru.setVar("audPrefix", "q" + run);
        }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a token, the id of the administrator and a random prefix are ready", function () { expect(bru.getVar("audAdminToken")).to.be.a("string").and.not.empty; expect(bru.getVar("audAdminId")).to.be.a("number"); expect(bru.getVar("audPrefix")).to.match(/^q[a-z0-9]+$/); });
settings:
  encodeUrl: true
