info:
  name: '43 Developer · 400 comes before the 403'
  type: http
  seq: 43
http:
  method: GET
  url: '{{baseUrl}}/audit-log?actorUserId={{audAdminId}}&entityId=1'
  headers:
    - name: Authorization
      value: 'Bearer {{audDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "entityType", rule: "required", message: "This value is required." }] }); });
settings:
  encodeUrl: true
