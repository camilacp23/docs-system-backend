info:
  name: '54 Validation · 400 action outside the enum'
  type: http
  seq: 54
http:
  method: GET
  url: '{{baseUrl}}/audit-log?action=ARCHIVE'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields[0].field).to.equal("action"); expect(res.body.details.fields[0].rule).to.equal("enum"); });
settings:
  encodeUrl: true
