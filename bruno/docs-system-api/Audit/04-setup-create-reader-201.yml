info:
  name: '04 Setup · create Reader 201'
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/users'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Audit audreader",
        "email": "audreader-{{audRun}}@sandbox.local",
        "password": "Sandbox-Pass-2026",
        "role": "READER"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("audReaderId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the user is ready", function () { expect(bru.getVar("audReaderId")).to.be.a("number"); });
settings:
  encodeUrl: true
