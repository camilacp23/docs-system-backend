info:
  name: '26 Administrator · 200 the review event'
  type: http
  seq: 26
http:
  method: GET
  url: '{{baseUrl}}/audit-log?applicationId={{audAppId}}&action=EVENT'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("one DOCUMENTATION_RETURNED event of the screen with its payload in newValue", function () { expect(res.body.total).to.equal(1); const e = res.body.data[0]; expect(e.eventName).to.equal("DOCUMENTATION_RETURNED"); expect(e.entityType).to.equal("screen"); expect(e.entityId).to.equal(String(bru.getVar("audScrId"))); expect(e.entityLabel).to.equal(bru.getVar("audPrefix") + "Scr"); expect(e.oldValue).to.equal(null); expect(e.changedFields).to.deep.equal([]); expect(e.newValue.from).to.equal("IN_REVIEW"); expect(e.newValue.to).to.equal("IN_PROGRESS"); expect(e.newValue.commentId).to.be.a("number"); });
settings:
  encodeUrl: true
