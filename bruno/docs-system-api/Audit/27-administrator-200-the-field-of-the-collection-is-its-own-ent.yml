info:
  name: '27 Administrator · 200 the field of the collection is its own entity'
  type: http
  seq: 27
http:
  method: GET
  url: '{{baseUrl}}/audit-log?entityType=collection_field&entityId={{audFieldId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("one creation, by the Developer, with the keys in camelCase", function () { expect(res.body.total).to.equal(1); const c = res.body.data[0]; expect(c.action).to.equal("CREATE"); expect(c.actor.id).to.equal(bru.getVar("audDevId")); expect(c.newValue.collectionId).to.equal(bru.getVar("audColId")); expect(c.newValue.dataType).to.equal("TEXT"); expect(c.newValue.description).to.equal("first"); });
settings:
  encodeUrl: true
