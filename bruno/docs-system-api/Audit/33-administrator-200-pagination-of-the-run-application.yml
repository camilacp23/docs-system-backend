info:
  name: '33 Administrator · 200 pagination of the run application'
  type: http
  seq: 33
http:
  method: GET
  url: '{{baseUrl}}/audit-log?applicationId={{audAppId}}&pageSize=3&page=2'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("page 2 of 3 records, the same total as the whole list", function () { expect(res.body.page).to.equal(2); expect(res.body.pageSize).to.equal(3); expect(res.body.data).to.have.length(3); expect(res.body.total).to.equal(bru.getVar("audListTotal")); });
        test("it is the slice of the whole list", function () { const whole = JSON.parse(bru.getVar("audListBody")).data.slice(3, 6).map(function (e) { return e.id; }); expect(res.body.data.map(function (e) { return e.id; })).to.deep.equal(whole); });
settings:
  encodeUrl: true
