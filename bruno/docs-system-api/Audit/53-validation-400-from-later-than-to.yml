info:
  name: '53 Validation · 400 from later than to'
  type: http
  seq: 53
http:
  method: GET
  url: '{{baseUrl}}/audit-log?from=2026-11-02T00:00:00.000Z&to=2026-11-01T00:00:00.000Z'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "to", rule: "range", message: "'to' must not be earlier than 'from'." }] }); });
settings:
  encodeUrl: true
