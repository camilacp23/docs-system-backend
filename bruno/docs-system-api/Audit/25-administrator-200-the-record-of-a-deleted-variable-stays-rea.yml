info:
  name: '25 Administrator · 200 the record of a deleted variable stays readable'
  type: http
  seq: 25
http:
  method: GET
  url: '{{baseUrl}}/audit-log?entityType=variable&entityId={{audVarTmpId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{audAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a deletion and a creation", function () { expect(res.body.data.map(function (e) { return e.action; })).to.deep.equal(["DELETE", "CREATE"]); });
        test("the deletion has only the old value and the label of the element", function () { const d = res.body.data[0]; expect(d.newValue).to.equal(null); expect(d.oldValue.name).to.equal(bru.getVar("audPrefix") + "Tmp"); expect(d.entityLabel).to.equal(bru.getVar("audPrefix") + "Tmp"); expect(d.applicationId).to.equal(bru.getVar("audAppId")); });
settings:
  encodeUrl: true
