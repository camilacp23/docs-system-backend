info:
  name: '20 Access · 401 no token'
  type: http
  seq: 20
http:
  method: GET
  url: '{{baseUrl}}/audit-log?applicationId={{audAppId}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code UNAUTHENTICATED, message and details", function () { expect(res.body.code).to.equal("UNAUTHENTICATED"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("Your session is not valid. Sign in again."); expect(res.body.details).to.deep.equal(null); });
settings:
  encodeUrl: true
