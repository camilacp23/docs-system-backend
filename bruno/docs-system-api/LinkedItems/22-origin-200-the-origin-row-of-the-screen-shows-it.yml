info:
  name: '22 Origin · 200 the origin row of the screen shows it, the other link does not'
  type: http
  seq: 22
http:
  method: GET
  url: '{{baseUrl}}/screens/{{lkMainId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{lkReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
        test("only the origin row carries originUsedIn", function () { const links = res.body.data.variableLinks; const origin = links.filter(function (l) { return l.isOrigin; }); expect(origin.length).to.equal(1); expect(origin[0].variable.id).to.equal(Number(bru.getVar("lkOriginId"))); expect(origin[0].usedIn).to.equal("origin"); expect(origin[0].originUsedIn).to.equal("OnVisible"); const other = links.filter(function (l) { return !l.isOrigin; }); expect(other.length).to.equal(1); expect(other[0].originUsedIn).to.equal(null); });
settings:
  encodeUrl: true
