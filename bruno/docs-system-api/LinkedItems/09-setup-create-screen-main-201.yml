info:
  name: '09 Setup · create screen Main (links the variable, navigates to Target) 201'
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{lkDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{lkAppId}},
        "name": "{{lkPrefix}}Main",
        "miroLink": null,
        "template": { "onStart": null, "workingProcess": null, "architecture": null, "dataModel": null, "requirements": null, "knownIssues": null, "risks": null },
        "components": [],
        "variableLinks": [{ "variableId": {{lkLinkedId}}, "accessMode": "READ", "usedIn": "lblName.Text" }],
        "collectionLinks": [],
        "navigations": [{ "targetScreenId": {{lkTargetId}}, "description": null }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("lkMainId", res.body.data.id); bru.setVar("lkLinkId", res.body.data.variableLinks[0].id); bru.setVar("lkNavId", res.body.data.navigations[0].id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("Main is ready with its link and navigation", function () { expect(bru.getVar("lkMainId")).to.be.a("number"); expect(bru.getVar("lkLinkId")).to.be.a("number"); expect(bru.getVar("lkNavId")).to.be.a("number"); });
settings:
  encodeUrl: true
