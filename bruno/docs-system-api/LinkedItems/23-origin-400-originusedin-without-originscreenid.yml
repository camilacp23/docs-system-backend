info:
  name: '23 Origin · 400 originUsedIn without originScreenId'
  type: http
  seq: 23
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{lkDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{lkAppId}},
        "name": "{{lkPrefix}}gNoOrigin",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "originUsedIn": "OnVisible",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "originUsedIn", rule: "requires", message: "Choose the origin screen first, or leave this empty." }] }); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
settings:
  encodeUrl: true
