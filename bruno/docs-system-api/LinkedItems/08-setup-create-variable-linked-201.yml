info:
  name: '08 Setup · create the GLOBAL variable that the screen links to 201'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{lkDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{lkAppId}},
        "name": "{{lkPrefix}}gLinked",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("lkLinkedId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: true
