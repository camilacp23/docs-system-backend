name: sandbox
variables:
  - name: baseUrl
    value: http://localhost:3001/api/v1
  - name: origin
    value: http://localhost:5173
  - name: adminEmail
    value: '{{process.env.SANDBOX_ADMIN_EMAIL}}'
  - name: adminPassword
    value: '{{process.env.SANDBOX_ADMIN_PASSWORD}}'
  - name: reservedEmail
    value: '{{process.env.SANDBOX_RESERVED_EMAIL}}'
  - name: reservedId
    value: '{{process.env.SANDBOX_RESERVED_ID}}'
  - name: fixturesAppId
    value: '{{process.env.SANDBOX_FIXTURES_APP_ID}}'
  - name: screenAId
    value: '{{process.env.SANDBOX_FIXTURES_SCREEN_A_ID}}'
  - name: screenBId
    value: '{{process.env.SANDBOX_FIXTURES_SCREEN_B_ID}}'
  - name: sharedVariableId
    value: '{{process.env.SANDBOX_FIXTURES_VARIABLE_ID}}'
  - name: linkedVariableId
    value: '{{process.env.SANDBOX_FIXTURES_LINKED_VARIABLE_ID}}'
  - name: collectionId
    value: '{{process.env.SANDBOX_FIXTURES_COLLECTION_ID}}'
  - name: documentedCollectionId
    value: '{{process.env.SANDBOX_FIXTURES_DOCUMENTED_COLLECTION_ID}}'
  - name: jiraSimUrl
    value: '{{process.env.SANDBOX_JIRA_BASE_URL}}'
  - name: jiraWebhookSecret
    value: '{{process.env.SANDBOX_JIRA_WEBHOOK_SECRET}}'
