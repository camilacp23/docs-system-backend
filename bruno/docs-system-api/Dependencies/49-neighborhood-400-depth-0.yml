info:
  name: '49 Neighborhood · 400 depth 0'
  type: http
  seq: 49
http:
  method: GET
  url: '{{baseUrl}}/dependencies/collections/{{depColAId}}?depth=0'
  headers:
    - name: Authorization
      value: 'Bearer {{depAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });

        test("details.fields names depth", function () { expect(res.body.details.fields.map(function (f) { return f.field; })).to.include("depth"); });
settings:
  encodeUrl: true
