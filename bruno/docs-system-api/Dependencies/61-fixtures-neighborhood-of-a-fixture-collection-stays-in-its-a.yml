info:
  name: '61 Fixtures · neighborhood of a fixture collection stays in its application'
  type: http
  seq: 61
http:
  method: GET
  url: '{{baseUrl}}/dependencies/collections/{{collectionId}}?depth=2'
  headers:
    - name: Authorization
      value: 'Bearer {{depReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const nodes = res.body.data.nodes, edges = res.body.data.edges;
        const keys = nodes.map(function (n) { return n.key; });
        const byName = function (n) { return nodes.find(function (x) { return x.name === n; }); };
        const kinds = function () { const c = {}; edges.forEach(function (e) { c[e.kind] = (c[e.kind] || 0) + 1; }); return c; };
        test("every edge points to two nodes of the response and nothing repeats", function () { const set = new Set(keys); expect(set.size).to.equal(keys.length); expect(new Set(edges.map(function (e) { return e.id; })).size).to.equal(edges.length); edges.forEach(function (e) { expect(set.has(e.source), e.id + " source").to.equal(true); expect(set.has(e.target), e.id + " target").to.equal(true); }); });
        test("the collection is the center and no node of the run application is there", function () { expect(keys).to.include("collection:" + bru.getEnvVar("collectionId")); expect(nodes.some(function (n) { return n.name.indexOf(bru.getVar("depPrefix")) === 0; })).to.equal(false); });
settings:
  encodeUrl: true
