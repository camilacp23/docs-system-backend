info:
  name: '45 Neighborhood · 404 element does not exist'
  type: http
  seq: 45
http:
  method: GET
  url: '{{baseUrl}}/dependencies/variables/999999999'
  headers:
    - name: Authorization
      value: 'Bearer {{depAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message", function () { expect(res.body.message).to.equal("This variable doesn't exist. It may have been deleted."); });

        test("the missing element", function () { expect(res.body.details.element).to.equal("variable"); });
settings:
  encodeUrl: true
