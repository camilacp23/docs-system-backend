info:
  name: '11 Setup · create variable Ctx (CONTEXT, origin Two) 201'
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{depDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{depAppId}},
        "name": "{{depPrefix}}Ctx",
        "dataType": "TEXT",
        "scope": "CONTEXT",
        "originScreenId": {{depScrTwoId}},
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("depCtxId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("depCtxId")).to.be.a("number"); });
settings:
  encodeUrl: true
