info:
  name: '41 Neighborhood · collection ColA depth 1 as Reader (Used by screens, DERIVES_FROM cycle)'
  type: http
  seq: 41
http:
  method: GET
  url: '{{baseUrl}}/dependencies/collections/{{depColAId}}?depth=1'
  headers:
    - name: Authorization
      value: 'Bearer {{depReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("depColAEtagN", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const nodes = res.body.data.nodes, edges = res.body.data.edges;
        const keys = nodes.map(function (n) { return n.key; });
        const byName = function (n) { return nodes.find(function (x) { return x.name === n; }); };
        const kinds = function () { const c = {}; edges.forEach(function (e) { c[e.kind] = (c[e.kind] || 0) + 1; }); return c; };
        test("every edge points to two nodes of the response and nothing repeats", function () { const set = new Set(keys); expect(set.size).to.equal(keys.length); expect(new Set(edges.map(function (e) { return e.id; })).size).to.equal(edges.length); edges.forEach(function (e) { expect(set.has(e.source), e.id + " source").to.equal(true); expect(set.has(e.target), e.id + " target").to.equal(true); }); });
        test("the collection, its screen, the variable it feeds and the collection it derives from and feeds", function () {
          const p = bru.getVar("depPrefix");
          expect(nodes.map(function (n) { return n.name; })).to.have.members([p + "One", p + "Glob", p + "ColA", p + "ColB"]);
        });
        test("the screens that use the collection: one ACCESSES edge per link, with accessMode and usedIn", function () {
          const own = "collection:" + bru.getVar("depColAId");
          const access = edges.filter(function (e) { return e.kind === "ACCESSES" && e.target === own; });
          expect(access.map(function (e) { return [e.accessMode, e.usedIn]; })).to.deep.equal([["READ", "OnVisible"], ["READ_WRITE", "btnSave.OnSelect"]]);
          expect(new Set(access.map(function (e) { return e.source; })).size).to.equal(1);
        });
        test("the cycle gives each collection once and both DERIVES_FROM edges", function () { expect(edges.filter(function (e) { return e.kind === "DERIVES_FROM"; })).to.have.length(2); });
settings:
  encodeUrl: true
