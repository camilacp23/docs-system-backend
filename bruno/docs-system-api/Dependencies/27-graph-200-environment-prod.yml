info:
  name: '27 Graph · 200 environment=PROD'
  type: http
  seq: 27
http:
  method: GET
  url: '{{baseUrl}}/dependencies/graph?applicationId={{depAppId}}&environment=PROD'
  headers:
    - name: Authorization
      value: 'Bearer {{depReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const nodes = res.body.data.nodes, edges = res.body.data.edges;
        const keys = nodes.map(function (n) { return n.key; });
        const byName = function (n) { return nodes.find(function (x) { return x.name === n; }); };
        const kinds = function () { const c = {}; edges.forEach(function (e) { c[e.kind] = (c[e.kind] || 0) + 1; }); return c; };
        test("every edge points to two nodes of the response and nothing repeats", function () { const set = new Set(keys); expect(set.size).to.equal(keys.length); expect(new Set(edges.map(function (e) { return e.id; })).size).to.equal(edges.length); edges.forEach(function (e) { expect(set.has(e.source), e.id + " source").to.equal(true); expect(set.has(e.target), e.id + " target").to.equal(true); }); });
        test("variables and collections of PROD only; screens and components are not filtered", function () {
          const p = bru.getVar("depPrefix");
          expect(nodes.filter(function (n) { return n.type === "VARIABLE" || n.type === "COLLECTION"; }).map(function (n) { return n.name; })).to.have.members([p + "Glob", p + "ProdOnly", p + "ColB"]);
          expect(nodes.filter(function (n) { return n.type === "SCREEN"; })).to.have.length(3);
          expect(nodes.filter(function (n) { return n.type === "COMPONENT"; })).to.have.length(1);
        });
        test("an edge whose end is DEV only is gone", function () { expect(kinds()).to.deep.equal({ CONTAINS: 1, ACCESSES: 1, USES: 1, NAVIGATES_TO: 2 }); });
settings:
  encodeUrl: true
