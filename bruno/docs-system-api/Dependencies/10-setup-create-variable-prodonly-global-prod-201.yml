info:
  name: '10 Setup · create variable ProdOnly (GLOBAL, PROD) 201'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{depDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{depAppId}},
        "name": "{{depPrefix}}ProdOnly",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "PROD" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("depProdId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("depProdId")).to.be.a("number"); });
settings:
  encodeUrl: true
