info:
  name: '32 Graph · 400 types has an unknown type'
  type: http
  seq: 32
http:
  method: GET
  url: '{{baseUrl}}/dependencies/graph?applicationId={{depAppId}}&types=SCREEN,NOPE'
  headers:
    - name: Authorization
      value: 'Bearer {{depAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });

        test("details.fields names types", function () { expect(res.body.details.fields.some(function (f) { return f.field.indexOf("types") === 0; })).to.equal(true); });
settings:
  encodeUrl: true
