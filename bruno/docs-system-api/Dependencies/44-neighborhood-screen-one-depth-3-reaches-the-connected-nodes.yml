info:
  name: '44 Neighborhood · screen One depth 3 reaches the connected nodes only'
  type: http
  seq: 44
http:
  method: GET
  url: '{{baseUrl}}/dependencies/screens/{{depScrOneId}}?depth=3'
  headers:
    - name: Authorization
      value: 'Bearer {{depDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const nodes = res.body.data.nodes, edges = res.body.data.edges;
        const keys = nodes.map(function (n) { return n.key; });
        const byName = function (n) { return nodes.find(function (x) { return x.name === n; }); };
        const kinds = function () { const c = {}; edges.forEach(function (e) { c[e.kind] = (c[e.kind] || 0) + 1; }); return c; };
        test("every edge points to two nodes of the response and nothing repeats", function () { const set = new Set(keys); expect(set.size).to.equal(keys.length); expect(new Set(edges.map(function (e) { return e.id; })).size).to.equal(edges.length); edges.forEach(function (e) { expect(set.has(e.source), e.id + " source").to.equal(true); expect(set.has(e.target), e.id + " target").to.equal(true); }); });
        test("seven nodes: the ProdOnly variable and App (OnStart) are not connected", function () {
          const p = bru.getVar("depPrefix");
          expect(nodes.map(function (n) { return n.name; })).to.have.members([p + "One", p + "Two", "btnGo", p + "Glob", p + "Ctx", p + "ColA", p + "ColB"]);
        });
        test("both directions: ColB is reached against the direction of its DERIVES_FROM edge", function () { expect(edges.some(function (e) { return e.kind === "DERIVES_FROM" && e.source === "collection:" + bru.getVar("depColBId") && e.target === "collection:" + bru.getVar("depColAId"); })).to.equal(true); });
settings:
  encodeUrl: true
