info:
  name: '07 Setup · App (OnStart) screen of the run application'
  type: http
  seq: 7
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{depAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{depAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("depAppScreenId", res.body.data[0].id); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the first screen is App (OnStart)", function () { expect(res.body.data[0].name).to.equal("App (OnStart)"); });
settings:
  encodeUrl: true
