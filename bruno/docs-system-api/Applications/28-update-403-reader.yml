info:
  name: 28 Update 403 (reader)
  type: http
  seq: 28
http:
  method: PUT
  url: '{{baseUrl}}/applications/{{appId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{appReaderToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{appName}}",
        "platform": "Power Apps 2",
        "status": "ARCHIVED"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("error body has code FORBIDDEN, message and details", function () {
          expect(res.body.code).to.equal("FORBIDDEN");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
