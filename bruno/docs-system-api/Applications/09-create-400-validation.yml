info:
  name: 09 Create 400 (invalid Jira key)
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/applications'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Invalid {{appRun}}",
        "platform": "Web",
        "jiraProjectKey": "techea"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields names jiraProjectKey", function () {
          expect(res.body.details.fields.some(function (f) { return f.field.indexOf("jiraProjectKey") >= 0; })).to.equal(true);
        });
settings:
  encodeUrl: true
