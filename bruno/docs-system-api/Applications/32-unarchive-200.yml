info:
  name: 32 Unarchive 200
  type: http
  seq: 32
http:
  method: PUT
  url: '{{baseUrl}}/applications/{{appId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
    - name: If-Match
      value: '{{appEtag}}'
  body:
    type: json
    data: |-
      {
        "name": "{{appName}}",
        "platform": "Power Apps 2",
        "status": "ACTIVE"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the application is active again", function () { expect(res.body.data.status).to.equal("ACTIVE"); });
settings:
  encodeUrl: true
