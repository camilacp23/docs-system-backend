info:
  name: 26 Update 404
  type: http
  seq: 26
http:
  method: PUT
  url: '{{baseUrl}}/applications/999999'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{appName}}",
        "platform": "Power Apps 2",
        "status": "ACTIVE"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () {
          expect(res.body.code).to.equal("NOT_FOUND");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
