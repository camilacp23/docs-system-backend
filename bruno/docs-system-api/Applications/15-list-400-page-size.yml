info:
  name: 15 List 400 (pageSize above the maximum)
  type: http
  seq: 15
http:
  method: GET
  url: '{{baseUrl}}/applications?pageSize=101'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
