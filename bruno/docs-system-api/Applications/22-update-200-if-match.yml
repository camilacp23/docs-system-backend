info:
  name: 22 Update 200 (matching If-Match, omitted fields become null)
  type: http
  seq: 22
http:
  method: PUT
  url: '{{baseUrl}}/applications/{{appId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
    - name: If-Match
      value: '{{appEtag}}'
  body:
    type: json
    data: |-
      {
        "name": "{{appName}}",
        "platform": "Power Apps 2",
        "status": "ACTIVE"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("appEtagOld", bru.getVar("appEtag")); bru.setVar("appEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("full replacement: description and jiraProjectKey are null", function () {
          expect(res.body.data.platform).to.equal("Power Apps 2");
          expect(res.body.data.description).to.equal(null);
          expect(res.body.data.jiraProjectKey).to.equal(null);
        });
        test("the ETag changed", function () {
          expect(res.headers["etag"]).to.match(/^W\/"\d+"$/);
          expect(res.headers["etag"]).to.not.equal(bru.getVar("appEtagOld"));
        });
settings:
  encodeUrl: true
