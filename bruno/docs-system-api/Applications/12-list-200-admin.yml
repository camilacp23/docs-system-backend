info:
  name: 12 List 200 (administrator, q and status)
  type: http
  seq: 12
http:
  method: GET
  url: '{{baseUrl}}/applications?q={{appName}}&status=ACTIVE'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("collection envelope with the created application", function () {
          expect(res.body).to.include.keys("data", "page", "pageSize", "total");
          expect(res.body.page).to.equal(1);
          expect(res.body.total).to.equal(1);
          expect(res.body.data[0].id).to.equal(bru.getVar("appId"));
          expect(res.body.data[0].appContextScreen.name).to.equal("App (OnStart)");
        });
settings:
  encodeUrl: true
