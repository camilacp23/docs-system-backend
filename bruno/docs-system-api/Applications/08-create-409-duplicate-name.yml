info:
  name: 08 Create 409 (DUPLICATE_NAME)
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/applications'
  headers:
    - name: Authorization
      value: 'Bearer {{appAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{appName}}",
        "platform": "Web"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function () { expect(res.status).to.equal(409); });
        test("error body has code DUPLICATE_NAME, message and details", function () {
          expect(res.body.code).to.equal("DUPLICATE_NAME");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("message names the application and the scope", function () {
          expect(res.body.message).to.equal("An application named " + bru.getVar("appName") + " already exists in Documentación técnica.");
        });
        test("details", function () {
          expect(res.body.details).to.deep.equal({ field: "name", type: "application", name: bru.getVar("appName"), application: "Documentación técnica", container: "system" });
        });
settings:
  encodeUrl: true
