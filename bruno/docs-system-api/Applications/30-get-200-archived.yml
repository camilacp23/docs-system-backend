info:
  name: 30 Get 200 (archived, still readable)
  type: http
  seq: 30
http:
  method: GET
  url: '{{baseUrl}}/applications/{{appId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{appReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("status is ARCHIVED", function () { expect(res.body.data.status).to.equal("ARCHIVED"); });
settings:
  encodeUrl: true
