info:
  name: 05 Setup · login reader 200
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "appreader-{{appRun}}@sandbox.local",
        "password": "Sandbox-Pass-2026"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("appReaderToken", res.body.data.accessToken); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the session belongs to the reader", function () { expect(res.body.data.user.role).to.equal("READER"); });
settings:
  encodeUrl: true
