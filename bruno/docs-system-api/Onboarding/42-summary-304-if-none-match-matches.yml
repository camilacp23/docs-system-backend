info:
  name: '42 Summary · 304 if-none-match matches'
  type: http
  seq: 42
http:
  method: GET
  url: '{{baseUrl}}/onboarding/summary?applicationId={{onbAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{onbAdminToken}}'
    - name: If-None-Match
      value: '{{onbEtag}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 304", function () { expect(res.status).to.equal(304); });
        test("no body", function () { expect(res.body === "" || res.body === undefined || res.body === null).to.equal(true); });
        test("the ETag is repeated", function () { expect(res.headers["etag"]).to.equal(bru.getVar("onbEtag")); });
settings:
  encodeUrl: true
