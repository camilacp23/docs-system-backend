info:
  name: '07 Setup · create the other application 201'
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/applications'
  headers:
    - name: Authorization
      value: 'Bearer {{onbAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Onboarding other {{onbRun}}",
        "platform": "Power Apps"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("onbOtherAppId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the other application is ready", function () { expect(bru.getVar("onbOtherAppId")).to.be.a("number"); });
settings:
  encodeUrl: true
