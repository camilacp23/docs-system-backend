info:
  name: '22 Setup · create variable gTop in the other application 201'
  type: http
  seq: 22
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{onbDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{onbOtherAppId}},
        "name": "{{onbPrefix}}gTop",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("onbOtherVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: true
