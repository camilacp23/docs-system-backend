info:
  name: '41 Summary · 200 administrator, exact body'
  type: http
  seq: 41
http:
  method: GET
  url: '{{baseUrl}}/onboarding/summary?applicationId={{onbAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{onbAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("onbEtag", res.headers["etag"]); bru.setVar("onbBody", JSON.stringify(res.body));
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a weak ETag", function () { expect(res.headers["etag"]).to.match(/^W\//); });
        const ids = JSON.parse(bru.getVar("onbIds"));
        const p = bru.getVar("onbPrefix");
        const d = res.body.data;
        const screens = function (list) { return list.map(function (n) { return [p + n[0], n[1], n[2]]; }); };
        test("the application and the counts", function () {
          expect(d.application).to.deep.equal({ id: Number(bru.getVar("onbAppId")), name: "Onboarding " + bru.getVar("onbRun") });
          expect(d.counts).to.deep.equal({ screens: 13, variables: 12, collections: 1, components: 13 });
          expect(d.approvedPercent).to.equal(0);
        });
        test("App (OnStart): status, Miro link and the seven template fields", function () {
          expect(d.appContextScreen).to.deep.equal({
            id: Number(bru.getVar("onbAppScreenId")), name: "App (OnStart)", documentationStatus: bru.getVar("onbAppStatus"),
            miroLink: "https://miro.com/app/board/" + bru.getVar("onbRun") + "/",
            template: { onStart: "Loads " + p + "gTop.", workingProcess: null, architecture: null, dataModel: null, requirements: null, knownIssues: null, risks: "None." }
          });
        });
        test("key screens: 10 of 12, App (OnStart) left out; by depth (the cycle gives 1, 2, 3), then connections, name; the unreachable ones last", function () {
          expect(d.keyScreens.length).to.equal(10);
          expect(d.keyScreens.map(function (k) { return [k.screen.name, k.connections, k.depth]; })).to.deep.equal(screens([
            ["S01", 4, 1], ["S06", 2, 1], ["S02", 4, 2], ["S03", 4, 3],
            ["S04", 2, null], ["S05", 2, null], ["S11", 2, null], ["S07", 1, null], ["S08", 1, null], ["S09", 1, null]
          ]));
          expect(d.keyScreens.map(function (k) { return k.screen.id; })).to.deep.equal(["S01", "S06", "S02", "S03", "S04", "S05", "S11", "S07", "S08", "S09"].map(function (n) { return ids[n]; }));
        });
        test("the one-connection tie is decided by name: S07, S08 and S09 are in; S10 and S12 are out", function () {
          const names = d.keyScreens.map(function (k) { return k.screen.name; });
          expect(names).to.not.include(p + "S10");
          expect(names).to.not.include(p + "S12");
        });
        test("global variables: 10 of 12 by screens, ties by name by code point (1, A, B, Z, _, a, b, c); gd and gz are cut", function () {
          expect(d.globalVariables.map(function (v) { return [v.variable.name, v.usedByScreens]; })).to.deep.equal(
            [["gTop", 4], ["gMid", 2], ["g1", 1], ["gA", 1], ["gB", 1], ["gZ", 1], ["g_", 1], ["ga", 1], ["gb", 1], ["gc", 1]].map(function (v) { return [p + v[0], v[1]]; }));
          d.globalVariables.forEach(function (v) { expect(v.dataType).to.equal("TEXT"); expect(v.originScreen).to.equal(null); });
        });
        test("top components: 10 of 12 that use something; by uses, then name by code point (uppercase first), then screen; idle (no use) is not listed", function () {
          expect(d.topComponents.map(function (c) { return [c.component.name, c.screen.name, c.uses]; })).to.deep.equal([
            ["Gal", p + "S01", 3], ["Btn", p + "S04", 2], ["btn", p + "S02", 2], ["btn", p + "S03", 2],
            ["J", p + "S10", 1], ["K", p + "S08", 1], ["M", p + "S06", 1], ["Z", p + "S12", 1], ["j", p + "S09", 1], ["k", p + "S07", 1]
          ]);
        });
settings:
  encodeUrl: true
