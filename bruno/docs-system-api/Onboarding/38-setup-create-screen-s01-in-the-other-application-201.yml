      value: 'Bearer {{onbDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{onbOtherAppId}},
        "name": "{{onbPrefix}}S01",
        "miroLink": null,
        "template": { "onStart": null, "workingProcess": null, "architecture": null, "dataModel": null, "requirements": null, "knownIssues": null, "risks": null },
        "components": [{ "name": "Gal", "type": "Button", "onSelect": null, "description": null, "uses": [{ "targetType": "VARIABLE", "targetId": {{onbOtherVarId}}, "description": null }] }],
        "variableLinks": [{ "variableId": {{onbOtherVarId}}, "accessMode": "READ", "usedIn": "Ctl0.Text" }],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("onbOtherScreenId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
