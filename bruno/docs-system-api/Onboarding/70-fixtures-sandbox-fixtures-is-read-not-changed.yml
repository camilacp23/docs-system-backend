info:
  name: '70 Fixtures · Sandbox Fixtures is read, not changed'
  type: http
  seq: 70
http:
  method: GET
  url: '{{baseUrl}}/onboarding/summary?applicationId={{fixturesAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{onbReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const d = res.body.data;
        test("Sandbox Fixtures: App (OnStart) and two screens, two variables and two collections", function () { expect(d.application.id).to.equal(Number(bru.getEnvVar("fixturesAppId"))); expect(d.counts.screens).to.equal(3); expect(d.counts.variables).to.equal(2); expect(d.counts.collections).to.equal(2); });
        test("the lists respect the limits", function () { expect(d.keyScreens.length).to.be.at.most(10); expect(d.globalVariables.length).to.be.at.most(10); expect(d.topComponents.length).to.be.at.most(10); });
settings:
  encodeUrl: true
