info:
  name: '52 Screen · the comment changed the tag of the screen (commentCount) but not its updatedAt'
  type: http
  seq: 52
http:
  method: GET
  url: '{{baseUrl}}/screens/{{comScrId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("five comments, same updatedAt, new tag", function () { expect(res.body.data.commentCount).to.equal(5); expect(res.body.data.updatedAt).to.equal(bru.getVar("comScrUpdatedAt")); expect(res.headers["etag"]).to.not.equal(bru.getVar("comScrEtag")); expect(res.headers["etag"]).to.equal('W/"' + new Date(res.body.data.updatedAt).getTime() + '-0-5"'); });
settings:
  encodeUrl: true
