info:
  name: '103 Cleanup · the other application stays archived with its one comment (a screen of an archived application cannot be deleted)'
  type: http
  seq: 103
http:
  method: GET
  url: '{{baseUrl}}/applications/{{comOtherAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("archived", function () { expect(res.body.data.status).to.equal("ARCHIVED"); });
settings:
  encodeUrl: true
