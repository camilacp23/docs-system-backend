info:
  name: '31 Read · 200 the thread oldest first, with the review comment and its reviewDecision'
  type: http
  seq: 31
http:
  method: GET
  url: '{{baseUrl}}/screens/{{comScrId}}/comments'
  headers:
    - name: Authorization
      value: 'Bearer {{comRdToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("comListEtag", res.headers["etag"]); bru.setVar("comRevId", res.body.data[3].id); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("four comments, oldest first, the same order as their ids", function () { const d = res.body.data; expect(res.body.total).to.equal(4); expect(d.map(function (c) { return c.id; })).to.deep.equal([bru.getVar("comDevCmtId"), bru.getVar("comRdCmtId"), bru.getVar("comAdmCmtId"), d[3].id]); });
        test("only the last one is a review comment", function () { const d = res.body.data; expect(d.map(function (c) { return c.reviewDecision; })).to.deep.equal([null, null, null, "RETURN"]); expect(d[3].text).to.equal("Please document the risks."); expect(d[3].author.id).to.equal(bru.getVar("comAdminUserId")); });
        test("an item carries every field of the contract", function () { expect(Object.keys(res.body.data[0]).sort()).to.deep.equal(["author", "createdAt", "id", "reviewDecision", "screenId", "text", "updatedAt"]); });
        test("the list has its own ETag (hash of the body)", function () { expect(res.headers["etag"]).to.match(/^W\/"[^"]+"$/); });
settings:
  encodeUrl: true
