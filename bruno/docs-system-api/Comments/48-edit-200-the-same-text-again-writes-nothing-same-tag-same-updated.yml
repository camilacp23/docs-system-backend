info:
  name: '48 Edit · 200 the same text again writes nothing: same tag, same updatedAt'
  type: http
  seq: 48
http:
  method: PUT
  url: '{{baseUrl}}/comments/{{comDevCmtId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comDevToken}}'
    - name: If-Match
      value: '{{comDevEtag2}}'
  body:
    type: json
    data: |-
      { "text": "  Edited ñandú\n  keeps its spaces  " }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("same ETag and same updatedAt", function () { expect(res.headers["etag"]).to.equal(bru.getVar("comDevEtag2")); expect(res.body.data.updatedAt).to.equal(bru.getVar("comDevUpdatedAt")); });
settings:
  encodeUrl: true
