info:
  name: '40 Edit · 400 a blank text'
  type: http
  seq: 40
http:
  method: PUT
  url: '{{baseUrl}}/comments/{{comDevCmtId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comDevToken}}'
  body:
    type: json
    data: |-
      { "text": "  " }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("rule pattern", function () { expect(res.body.details.fields[0].rule).to.equal("pattern"); });
settings:
  encodeUrl: true
