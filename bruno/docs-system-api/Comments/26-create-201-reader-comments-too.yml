info:
  name: '26 Create · 201 Reader comments too'
  type: http
  seq: 26
http:
  method: POST
  url: '{{baseUrl}}/screens/{{comScrId}}/comments'
  headers:
    - name: Authorization
      value: 'Bearer {{comRdToken}}'
  body:
    type: json
    data: |-
      { "text": "A question from the Reader" }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("comRdCmtId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the author is the Reader", function () { expect(res.body.data.author.id).to.equal(bru.getVar("comRdUserId")); });
settings:
  encodeUrl: true
