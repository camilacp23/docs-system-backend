info:
  name: '62 Archived · 422 APPLICATION_ARCHIVED: the author cannot edit it either (before the If-Match)'
  type: http
  seq: 62
http:
  method: PUT
  url: '{{baseUrl}}/comments/{{comOtherCmtId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comDevToken}}'
    - name: If-Match
      value: 'W/"1"'
  body:
    type: json
    data: |-
      { "text": "Too late to edit" }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("code", function () { expect(res.body.code).to.equal("APPLICATION_ARCHIVED"); });
settings:
  encodeUrl: true
