info:
  name: '08 Setup · create screen Alpha with the seven template fields 201'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{comDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{comAppId}},
        "name": "{{comPrefix}}Alpha",
        "miroLink": null,
        "template": { "onStart": "a", "workingProcess": "b", "architecture": "c", "dataModel": "d", "requirements": "e", "knownIssues": "f", "risks": "g" },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("comScrId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the screen is ready", function () { expect(bru.getVar("comScrId")).to.be.a("number"); });
settings:
  encodeUrl: true
