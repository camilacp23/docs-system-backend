info:
  name: '01 Setup · administrator login 200'
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("comAdminToken", res.body.data.accessToken); bru.setVar("comAdminUserId", res.body.data.user.id); }
        const run = Math.random().toString(36).slice(2, 10);
        bru.setVar("comRun", run);
        bru.setVar("comPrefix", "c" + run);
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a token and a random name prefix that starts with a letter are ready", function () { expect(bru.getVar("comAdminToken")).to.be.a("string").and.not.empty; expect(bru.getVar("comPrefix")).to.match(/^c[a-z0-9]+$/); });
settings:
  encodeUrl: true
