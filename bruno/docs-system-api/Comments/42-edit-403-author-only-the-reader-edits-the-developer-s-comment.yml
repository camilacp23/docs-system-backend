info:
  name: "42 Edit · 403 AUTHOR_ONLY: the Reader edits the Developer's comment"
  type: http
  seq: 42
http:
  method: PUT
  url: '{{baseUrl}}/comments/{{comDevCmtId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{comRdToken}}'
  body:
    type: json
    data: |-
      { "text": "Not mine" }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("code, message and reason", function () { expect(res.body.code).to.equal("FORBIDDEN"); expect(res.body.message).to.equal("You can only edit your own comments."); expect(res.body.details).to.deep.equal({ reason: "AUTHOR_ONLY" }); });
settings:
  encodeUrl: true
