info:
  name: '41 Validation · 400 step 6 is outside 1 to 5'
  type: http
  seq: 41
http:
  method: PUT
  url: '{{baseUrl}}/onboarding/progress/steps/6?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opDevToken}}'
  body:
    type: json
    data: |-
      {}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "step", rule: "maximum", message: "must be <= 5" }] }); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
settings:
  encodeUrl: true
