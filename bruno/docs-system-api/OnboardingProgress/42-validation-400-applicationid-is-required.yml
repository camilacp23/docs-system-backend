info:
  name: '42 Validation · 400 applicationId is required'
  type: http
  seq: 42
http:
  method: GET
  url: '{{baseUrl}}/onboarding/progress'
  headers:
    - name: Authorization
      value: 'Bearer {{opDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields[0].field).to.equal("applicationId"); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
settings:
  encodeUrl: true
