info:
  name: '101 Cleanup · 200 nobody has progress left in the run application'
  type: http
  seq: 101
http:
  method: GET
  url: '{{baseUrl}}/onboarding/progress?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("nothing completed", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [] }); });
settings:
  encodeUrl: true
