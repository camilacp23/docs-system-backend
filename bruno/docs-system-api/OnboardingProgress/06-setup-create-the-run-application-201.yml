info:
  name: '06 Setup · create the run application 201'
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/applications'
  headers:
    - name: Authorization
      value: 'Bearer {{opAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Progreso de incorporación ñandú {{opPrefix}}",
        "platform": "Power Apps"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("opAppId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the application is ready, and the accents come back unchanged", function () { expect(bru.getVar("opAppId")).to.be.a("number"); expect(res.body.data.name).to.equal(bru.interpolate("Progreso de incorporación ñandú {{opPrefix}}")); });
settings:
  encodeUrl: true
