info:
  name: '21 Mark · 200 the same step again changes nothing'
  type: http
  seq: 21
http:
  method: PUT
  url: '{{baseUrl}}/onboarding/progress/steps/2?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opDevToken}}'
  body:
    type: json
    data: |-
      {}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("still only step 2, without repeats", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [2] }); });
settings:
  encodeUrl: true
