info:
  name: '23 Read · 200 the Developer sees the steps'
  type: http
  seq: 23
http:
  method: GET
  url: '{{baseUrl}}/onboarding/progress?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("opDevEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("steps 1 and 2", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [1, 2] }); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
settings:
  encodeUrl: true
