info:
  name: '11 Read · 200 no progress yet (administrator)'
  type: http
  seq: 11
http:
  method: GET
  url: '{{baseUrl}}/onboarding/progress?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("opAdminEtag0", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("nothing completed yet, five steps in all", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [] }); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
        test("an ETag is sent", function () { expect(res.headers["etag"]).to.be.a("string").and.not.empty; });
settings:
  encodeUrl: true
