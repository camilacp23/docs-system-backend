info:
  name: '33 Read · 200 the reset does not touch the Reader'
  type: http
  seq: 33
http:
  method: GET
  url: '{{baseUrl}}/onboarding/progress?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("step 3 is still there", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [3] }); });
settings:
  encodeUrl: true
