info:
  name: '22 Mark · 200 step 1 after step 2: the steps come back ascending'
  type: http
  seq: 22
http:
  method: PUT
  url: '{{baseUrl}}/onboarding/progress/steps/1?applicationId={{opAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{opDevToken}}'
  body:
    type: json
    data: |-
      {}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("steps 1 and 2", function () { const d = res.body.data; expect(d).to.deep.equal({ applicationId: Number(bru.getVar("opAppId")), totalSteps: 5, completedSteps: [1, 2] }); });
settings:
  encodeUrl: true
