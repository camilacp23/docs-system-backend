info:
  name: '82 Poll · the report of the archived application until READY or FAILED'
  type: http
  seq: 82
http:
  method: GET
  url: '{{baseUrl}}/reports/{{repArchivedId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        // Polling: at most 60 looks, a short pause between them, never one long wait.
        const MAX = 60;
        const n = (bru.getVar("repPollArchived") || 0) + 1;
        bru.setVar("repPollArchived", n);
        const state = res.body && res.body.data ? res.body.data.status : undefined;
        if (res.status === 200 && state === "PENDING" && n < MAX) {
          await bru.sleep(250);
          bru.runner.setNextRequest("82 Poll · the report of the archived application until READY or FAILED");
        }
    - type: tests
      code: |-
        const MAX = 60;
        const n = bru.getVar("repPollArchived");
        const state = res.body && res.body.data ? res.body.data.status : undefined;
        // While it is PENDING and there are looks left nothing is asserted: the next look decides.
        if (res.status !== 200 || state !== "PENDING" || n >= MAX) {
          test("status 200", function () { expect(res.status).to.equal(200); });
          test("it finished before " + MAX + " looks, and it is READY (took " + n + " looks)", function () { expect(res.body.data.status).to.equal("READY"); });
          bru.setVar("repArchivedEtag", res.headers["etag"]);
        }
settings:
  encodeUrl: true
