info:
  name: '23 Request · 400 repeated values with their position'
  type: http
  seq: 23
http:
  method: POST
  url: '{{baseUrl}}/reports/pdf'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{repAppId}}, "title": "x", "scope": { "elementTypes": ["SCREEN", "VARIABLE", "SCREEN"], "screenIds": [{{repScrId}}, {{repScrId}}], "documentationStatus": ["DRAFT", "DRAFT"] }, "publish": false }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code and message", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); });
        test("each repeated value is unique at its position", function () { expect(res.body.details.fields.map(function (f) { return [f.field, f.rule]; })).to.deep.equal([["scope.elementTypes[2]", "unique"], ["scope.screenIds[1]", "unique"], ["scope.documentationStatus[1]", "unique"]]); });
settings:
  encodeUrl: true
