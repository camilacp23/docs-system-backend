info:
  name: '52 Read · list 400 without applicationId'
  type: http
  seq: 52
http:
  method: GET
  url: '{{baseUrl}}/reports'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code and message", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); });
        test("applicationId is the field", function () { expect(res.body.details.fields[0].field).to.equal("applicationId"); });
settings:
  encodeUrl: true
