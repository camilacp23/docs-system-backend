info:
  name: '62 Download · Reader 200 for the published Excel'
  type: http
  seq: 62
http:
  method: GET
  url: '{{baseUrl}}/reports/{{repXlsxId}}/file'
  headers:
    - name: Authorization
      value: 'Bearer {{repReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("Content-Type and the name of the file", function () { expect(res.headers["content-type"]).to.equal("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); expect(res.headers["content-disposition"]).to.equal('attachment; filename="' + bru.getVar("repXlsxFileName") + '"'); });
        test("it is an Excel file: the signature PK 03 04", function () { const b = typeof res.body === "string" ? res.body : String.fromCharCode.apply(null, Array.from(res.body).slice(0, 4)); expect([b.charCodeAt(0), b.charCodeAt(1), b.charCodeAt(2), b.charCodeAt(3)]).to.deep.equal([0x50, 0x4b, 0x03, 0x04]); });
settings:
  encodeUrl: true
