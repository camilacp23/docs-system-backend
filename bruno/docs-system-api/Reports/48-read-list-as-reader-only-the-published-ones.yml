info:
  name: '48 Read · list as Reader: only the published ones'
  type: http
  seq: 48
http:
  method: GET
  url: '{{baseUrl}}/reports?applicationId={{repAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only the Excel", function () { expect(res.body.data.map(function (r) { return r.id; })).to.deep.equal([bru.getVar("repXlsxId")]); expect(res.body.total).to.equal(1); });
settings:
  encodeUrl: true
