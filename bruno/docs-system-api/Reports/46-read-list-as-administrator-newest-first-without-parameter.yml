info:
  name: '46 Read · list as Administrator: newest first, without parameters'
  type: http
  seq: 46
http:
  method: GET
  url: '{{baseUrl}}/reports?applicationId={{repAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("repListEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
        test("the Excel was asked for after the PDF, so it comes first; total, page and pageSize", function () { expect(res.body.data.map(function (r) { return r.id; })).to.deep.equal([bru.getVar("repXlsxId"), bru.getVar("repPdfId")]); expect([res.body.total, res.body.page, res.body.pageSize]).to.deep.equal([2, 1, 20]); });
        test("no item has parameters", function () { res.body.data.forEach(function (r) { expect(r).to.not.have.property("parameters"); }); });
        test("a weak hash of the body is the ETag", function () { expect(res.headers["etag"]).to.match(/^W\/"[^"]+"$/); });
settings:
  encodeUrl: true
