info:
  name: '44 Read · Reader 200 for a published report, with its parameters'
  type: http
  seq: 44
http:
  method: GET
  url: '{{baseUrl}}/reports/{{repXlsxId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("published, with its parameters", function () { const d = res.body.data; expect(d.isPublished).to.equal(true); expect(d.parameters.format).to.equal("XLSX"); expect(d.parameters.publish).to.equal(true); });
settings:
  encodeUrl: true
