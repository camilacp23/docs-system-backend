info:
  name: '77 Publication · 200 unpublish: publishedAt goes back to null'
  type: http
  seq: 77
http:
  method: PUT
  url: '{{baseUrl}}/reports/{{repPdfId}}/publication'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      { "isPublished": false }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("not published and no date", function () { expect([res.body.data.isPublished, res.body.data.publishedAt]).to.deep.equal([false, null]); });
settings:
  encodeUrl: true
