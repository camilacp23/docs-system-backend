info:
  name: '103 Cleanup · the three reports of the run are all that is left in its application'
  type: http
  seq: 103
http:
  method: GET
  url: '{{baseUrl}}/reports?applicationId={{repAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a report cannot be deleted: the three of this run, all READY", function () { expect(res.body.total).to.equal(3); res.body.data.forEach(function (r) { expect(r.status).to.equal("READY"); }); });
settings:
  encodeUrl: true
