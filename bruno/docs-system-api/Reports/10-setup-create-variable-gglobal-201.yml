info:
  name: '10 Setup · create variable gGlobal 201'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{repAppId}},
        "name": "{{repPrefix}}gGlobal",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }, { "environment": "PROD" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("repVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("repVarId")).to.be.a("number"); });
settings:
  encodeUrl: true
