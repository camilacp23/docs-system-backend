info:
  name: '08 Setup · create screen Alpha in the run application 201'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{repAppId}},
        "name": "{{repPrefix}}Alpha",
        "miroLink": null,
        "template": { "onStart": null, "workingProcess": null, "architecture": "Arquitectura de {{repPrefix}}: =SUM(1,1) y ñandú", "dataModel": null, "requirements": null, "knownIssues": null, "risks": null },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("repScrId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the screen is ready", function () { expect(bru.getVar("repScrId")).to.be.a("number"); });
settings:
  encodeUrl: true
