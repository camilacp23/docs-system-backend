info:
  name: '22 Request · 400 a title that is only spaces'
  type: http
  seq: 22
http:
  method: POST
  url: '{{baseUrl}}/reports/pdf'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{repAppId}}, "title": "   ", "scope": { "elementTypes": ["VARIABLE"] }, "publish": false }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code and message", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); });
        test("the title is the field", function () { const f = res.body.details.fields.find(function (x) { return x.field === "title"; }); expect(f).to.be.an("object"); expect(f.rule).to.equal("pattern"); });
settings:
  encodeUrl: true
