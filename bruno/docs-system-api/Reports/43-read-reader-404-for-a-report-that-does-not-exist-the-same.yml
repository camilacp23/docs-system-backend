info:
  name: '43 Read · Reader 404 for a report that does not exist: the same body'
  type: http
  seq: 43
http:
  method: GET
  url: '{{baseUrl}}/reports/999999999'
  headers:
    - name: Authorization
      value: 'Bearer {{repReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("code and message", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.equal("This report doesn't exist. It may have been deleted."); });
        test("the same message and the same shape as the hidden one", function () { expect(res.body.message).to.equal(bru.getVar("repHiddenMessage")); expect(Object.keys(res.body).sort()).to.deep.equal(["code", "details", "message"]); expect(res.body.details).to.deep.equal({ element: "report", id: 999999999 }); });
settings:
  encodeUrl: true
