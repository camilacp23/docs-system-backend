info:
  name: '25 Request · 400 screenIds without screens or components'
  type: http
  seq: 25
http:
  method: POST
  url: '{{baseUrl}}/reports/excel'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{repAppId}}, "title": "x", "scope": { "elementTypes": ["VARIABLE"], "screenIds": [{{repScrId}}], "documentationStatus": ["DRAFT"] }, "publish": false }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code and message", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); });
        test("notApplicable with the message of the contract", function () { expect(res.body.details.fields.map(function (f) { return [f.field, f.rule, f.message]; })).to.deep.equal([["scope.screenIds", "notApplicable", "scope.screenIds only applies when SCREEN or COMPONENT is selected."], ["scope.documentationStatus", "notApplicable", "scope.documentationStatus only applies when SCREEN or COMPONENT is selected."]]); });
settings:
  encodeUrl: true
