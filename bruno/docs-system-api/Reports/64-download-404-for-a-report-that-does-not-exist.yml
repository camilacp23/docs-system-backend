info:
  name: '64 Download · 404 for a report that does not exist'
  type: http
  seq: 64
http:
  method: GET
  url: '{{baseUrl}}/reports/999999999/file'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("code and message", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.equal("This report doesn't exist. It may have been deleted."); });
        test("details", function () { expect(res.body.details).to.deep.equal({ element: "report", id: 999999999 }); });
settings:
  encodeUrl: true
