info:
  name: '27 Request · 404 the application does not exist'
  type: http
  seq: 27
http:
  method: POST
  url: '{{baseUrl}}/reports/pdf'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": 999999999, "title": "x", "scope": { "elementTypes": ["VARIABLE"] }, "publish": false }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("code and message", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.equal("This application doesn't exist. It may have been deleted."); });
        test("details", function () { expect(res.body.details).to.deep.equal({ element: "application", id: 999999999 }); });
settings:
  encodeUrl: true
