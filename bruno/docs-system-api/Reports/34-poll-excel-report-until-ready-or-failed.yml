info:
  name: '34 Poll · Excel report until READY or FAILED'
  type: http
  seq: 34
http:
  method: GET
  url: '{{baseUrl}}/reports/{{repXlsxId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        // Polling: at most 60 looks, a short pause between them, never one long wait.
        const MAX = 60;
        const n = (bru.getVar("repPollXlsx") || 0) + 1;
        bru.setVar("repPollXlsx", n);
        const state = res.body && res.body.data ? res.body.data.status : undefined;
        if (res.status === 200 && state === "PENDING" && n < MAX) {
          await bru.sleep(250);
          bru.runner.setNextRequest("34 Poll · Excel report until READY or FAILED");
        }
    - type: tests
      code: |-
        const MAX = 60;
        const n = bru.getVar("repPollXlsx");
        const state = res.body && res.body.data ? res.body.data.status : undefined;
        // While it is PENDING and there are looks left nothing is asserted: the next look decides.
        if (res.status !== 200 || state !== "PENDING" || n >= MAX) {
          test("status 200", function () { expect(res.status).to.equal(200); });
          test("it finished before " + MAX + " looks, and it is READY (took " + n + " looks)", function () { expect(res.body.data.status).to.equal("READY"); });
          const d = res.body.data;
          test("READY and published in the same update", function () {
            expect(d.fileName).to.match(/^variables-y-pantallas-[a-z0-9]+-\d{4}-\d{2}-\d{2}\.xlsx$/);
            expect(d.fileSize).to.be.greaterThan(1000);
            expect([d.isPublished, d.publishedAt === d.completedAt, d.errorMessage]).to.deep.equal([true, true, null]);
          });
          bru.setVar("repXlsxEtag", res.headers["etag"]);
          bru.setVar("repXlsxFileName", d.fileName);
        }
settings:
  encodeUrl: true
