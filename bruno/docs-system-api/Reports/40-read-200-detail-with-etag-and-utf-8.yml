info:
  name: '40 Read · 200 detail with ETag and UTF-8'
  type: http
  seq: 40
http:
  method: GET
  url: '{{baseUrl}}/reports/{{repPdfId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the answer is UTF-8", function () { expect(String(res.headers["content-type"]).toLowerCase()).to.contain("charset=utf-8"); });
        test("the ETag is the one of its updatedAt and the title keeps its accents", function () { const d = res.body.data; expect(res.headers["etag"]).to.equal('W/"' + new Date(d.updatedAt).getTime() + '"'); expect(d.title).to.equal("Documentación ñandú – " + bru.getVar("repRun")); expect(d.generatedBy.name).to.equal("Reports developer"); });
settings:
  encodeUrl: true
