info:
  name: '65 Download · 400 a text id'
  type: http
  seq: 65
http:
  method: GET
  url: '{{baseUrl}}/reports/abc/file'
  headers:
    - name: Authorization
      value: 'Bearer {{repAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code and message", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); });
        test("the id is the field", function () { expect(res.body.details.fields[0].field).to.equal("id"); });
settings:
  encodeUrl: true
