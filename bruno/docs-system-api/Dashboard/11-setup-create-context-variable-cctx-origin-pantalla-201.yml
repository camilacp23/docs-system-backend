info:
  name: '11 Setup · create context variable cCtx (origin Pantalla) 201'
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{dasDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{dasAppId}},
        "name": "{{dasPrefix}}cCtx",
        "dataType": "TEXT",
        "scope": "CONTEXT",
        "originScreenId": {{dasScrId}},
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("dasCtxVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("dasCtxVarId")).to.be.a("number"); });
settings:
  encodeUrl: true
