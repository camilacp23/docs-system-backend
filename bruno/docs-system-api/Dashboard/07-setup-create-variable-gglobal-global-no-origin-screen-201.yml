info:
  name: '07 Setup · create variable gGlobal (GLOBAL, no origin screen) 201'
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{dasDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{dasAppId}},
        "name": "{{dasPrefix}}gGlobal",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("dasVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("dasVarId")).to.be.a("number"); });
settings:
  encodeUrl: true
