info:
  name: '24 Indicators · 200 reader, same figures and no recentActivity key'
  type: http
  seq: 24
http:
  method: GET
  url: '{{baseUrl}}/dashboard/indicators?applicationId={{dasAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{dasReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("dasReaderEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const d = res.body.data;
        test("documentation: three screens (App (OnStart), a draft, an approved one), the five statuses, 33.3 percent", function () { expect(d.documentation).to.deep.equal({ totalScreens: 3, byStatus: { UNDOCUMENTED: 1, DRAFT: 1, IN_PROGRESS: 0, IN_REVIEW: 0, APPROVED: 1 }, approvedPercent: 33.3 }); });
        test("variables: two, one without origin screen", function () { expect(d.variables).to.deep.equal({ total: 2, untraced: 1 }); });
        test("collections: two, one linked to no screen", function () { expect(d.collections).to.deep.equal({ total: 2, undocumented: 1 }); });
        test("jira: one pending Subtask, the simulated Jira is available, and the copy has a synchronization time", function () { expect(d.jira.pendingSubtasks).to.equal(1); expect(d.jira.jiraAvailable).to.equal(true); expect(d.jira.lastSyncedAt).to.be.a("string"); expect(new Date(d.jira.lastSyncedAt).toISOString()).to.equal(d.jira.lastSyncedAt); });
        test("the recentActivity key does not exist (not null, not an empty array)", function () { expect(Object.keys(d).sort()).to.deep.equal(["collections", "documentation", "jira", "variables"]); expect(JSON.stringify(res.body)).to.not.include("recentActivity"); });
        test("the Reader has a body of its own, so an ETag of its own", function () { expect(res.headers["etag"]).to.not.equal(bru.getVar("dasEtag")); });
settings:
  encodeUrl: true
