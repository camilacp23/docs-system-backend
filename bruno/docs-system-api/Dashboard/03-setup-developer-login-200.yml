info:
  name: '03 Setup · Developer login 200'
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "dasdeveloper-{{dasRun}}@sandbox.local",
        "password": "Sandbox-Pass-2026"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("dasDevToken", res.body.data.accessToken); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the token is ready", function () { expect(bru.getVar("dasDevToken")).to.be.a("string").and.not.empty; });
settings:
  encodeUrl: true
