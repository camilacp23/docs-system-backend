info:
  name: '09 Setup · create collection colFree (linked to no screen) 201'
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{dasDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{dasAppId}},
        "name": "{{dasPrefix}}colFree",
        "environments": [{ "environment": "DEV" }],
        "fields": [{ "name": "{{dasPrefix}}Campo", "dataType": "TEXT", "description": null, "position": 1 }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("dasColFreeId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the collection is ready", function () { expect(bru.getVar("dasColFreeId")).to.be.a("number"); });
settings:
  encodeUrl: true
