info:
  name: '15 Setup · create screen Segunda configuración (full template) 201'
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{dasDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{dasAppId}},
        "name": "{{dasPrefix}}Segunda configuración",
        "miroLink": null,
        "template": { "onStart": "a", "workingProcess": "b", "architecture": "c", "dataModel": "d", "requirements": "e", "knownIssues": "f", "risks": "g" },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("dasScr2Id", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the screen is ready", function () { expect(bru.getVar("dasScr2Id")).to.be.a("number"); });
settings:
  encodeUrl: true
