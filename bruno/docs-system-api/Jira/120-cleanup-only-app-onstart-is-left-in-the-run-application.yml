info:
  name: '120 Cleanup · only App (OnStart) is left in the run application'
  type: http
  seq: 120
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{jrAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("one screen", function () { expect(res.body.total).to.equal(1); expect(res.body.data[0].name).to.equal("App (OnStart)"); });
settings:
  encodeUrl: true
