runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code UNAUTHENTICATED, message and details", function () { expect(res.body.code).to.equal("UNAUTHENTICATED"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
