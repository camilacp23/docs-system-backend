http:
  method: POST
  url: '{{baseUrl}}/screens/{{jrAlphaId}}/jira-ticket'
  body:
    type: json
    data: |-
      { "newStory": { "summary": "{{jrPrefix}}Alpha n" }, "subtask": { "summary": "{{jrPrefix}}Alpha n" } }
