info:
  name: '70 Tree · Reader refresh 200 brings the changes in'
  type: http
  seq: 70
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrAlphaId}}/jira-tickets?refresh=true'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("completed refresh", function () { const s = res.body.data.sync; expect(s.stale).to.equal(false); expect(s.jiraAvailable).to.equal(true); expect(s.lastSyncedAt > v("jrTreeNewest")).to.equal(true); });
        test("status, category and summary updated; keys and structure kept", function () { const d = res.body.data; const t1 = by(d, v("jrAT1Key")); expect(t1.status).to.equal("Done"); expect(t1.statusCategory).to.equal("DONE"); const s2 = by(d, v("jrAS2Key")); expect(s2.status).to.equal("In Progress"); expect(s2.statusCategory).to.equal("IN_PROGRESS"); const s1 = by(d, v("jrAS1Key")); expect(s1.summary).to.equal(v("jrPrefix") + "Alpha story 1 renamed"); expect(s1.status).to.equal("To Do"); expect(d.stories.map(function (s) { return s.id; })).to.deep.equal([v("jrAS1Id"), v("jrAS2Id")]); expect(d.stories[0].subtasks).to.have.length(2); expect(d.stories[1].subtasks).to.have.length(1); });
        test("only the rows that changed took the new instant", function () { const d = res.body.data; const m = JSON.parse(v("jrTreeSynced")); expect(by(d, v("jrAT1Key")).lastSyncedAt).to.equal(d.sync.lastSyncedAt); expect(by(d, v("jrAEpicKey")).lastSyncedAt).to.equal(m[v("jrAEpicKey")]); expect(by(d, v("jrAT3Key")).lastSyncedAt).to.equal(m[v("jrAT3Key")]); });
settings:
  encodeUrl: true
