info:
  name: '94 Webhook · only the summary of the escaped body was applied'
  type: http
  seq: 94
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrHookId}}/jira-tickets'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        if (res.status === 200) { bru.setVar("jrHookSnap3", JSON.stringify(res.body.data)); }
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the id-less created event did nothing; the spaced body changed the summary", function () { const d = res.body.data; const t = by(d, v("jrHT2Key")); expect(t.summary).to.equal(v("jrPrefix") + "Hook sub 2 caf\u00e9"); expect(t.status).to.equal("To Do"); expect(t.statusCategory).to.equal("TO_DO"); const exp = JSON.parse(v("jrHookSnap2")); const e = by(exp, v("jrHT2Key")); e.summary = t.summary; e.lastSyncedAt = t.lastSyncedAt; exp.sync.lastSyncedAt = t.lastSyncedAt; expect(d).to.deep.equal(exp); });
settings:
  encodeUrl: true
