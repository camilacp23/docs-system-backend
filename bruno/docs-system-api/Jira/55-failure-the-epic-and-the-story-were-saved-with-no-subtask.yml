runtime:
  scripts:
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the storyId of the error is the local id of the Story", function () { const d = res.body.data; expect(d.epic.jiraIssueKey).to.equal(v("jrDEpicKey")); expect(d.stories).to.have.length(1); expect(d.stories[0].id).to.equal(v("jrDStoryId")); expect(d.stories[0].jiraIssueKey).to.equal(v("jrDStoryKey")); expect(d.stories[0].subtasks).to.deep.equal([]); });
