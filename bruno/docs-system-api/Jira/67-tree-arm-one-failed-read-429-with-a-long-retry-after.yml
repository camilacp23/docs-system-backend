info:
  name: '67 Tree · arm one failed read (429 with a long Retry-After)'
  type: http
  seq: 67
http:
  method: POST
  url: '{{jiraSimUrl}}/__sim/faults'
  body:
    type: json
    data: |-
      { "kind": "429", "retryAfterSeconds": 11, "count": 1, "appliesTo": "read" }
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const simBase = bru.interpolate("{{jiraSimUrl}}"); if (!/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(simBase)) { throw new Error("jiraSimUrl is not local: the request is not sent"); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
