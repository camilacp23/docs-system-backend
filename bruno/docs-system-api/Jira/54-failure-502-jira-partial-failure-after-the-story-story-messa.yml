info:
  name: '54 Failure · 502 JIRA_PARTIAL_FAILURE after the Story (Story message, with storyId)'
  type: http
  seq: 54
http:
  method: POST
  url: '{{baseUrl}}/screens/{{jrDeltaId}}/jira-ticket'
  headers:
    - name: Authorization
      value: 'Bearer {{jrDevToken}}'
  body:
    type: json
    data: |-
      { "newStory": { "summary": "{{jrPrefix}}Delta story" }, "subtask": { "summary": "{{jrPrefix}}Delta sub" } }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function v(k) { return bru.getVar(k); }
        if (res.status === 502) { bru.setVar("jrDStoryId", res.body.details.storyId); bru.setVar("jrDStoryKey", res.body.details.key); bru.setVar("jrDEpicKey", res.body.details.created.epic); }
    - type: tests
      code: |-
        function v(k) { return bru.getVar(k); }
        test("status 502", function () { expect(res.status).to.equal(502); });
        test("error body has code JIRA_PARTIAL_FAILURE, message and details", function () { expect(res.body.code).to.equal("JIRA_PARTIAL_FAILURE"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("Story message and details", function () { const dt = res.body.details; expect(dt.key).to.match(/^TECHEA-[0-9]+$/); expect(res.body.message).to.equal("The story " + dt.key + " was created, but the to-do wasn't. Try again to add it to that story."); expect(dt.created.story).to.equal(dt.key); expect(dt.created.epic).to.match(/^TECHEA-[0-9]+$/); expect(Object.keys(dt.created).sort()).to.deep.equal(["epic", "story"]); expect(dt.storyId).to.be.a("number"); });
settings:
  encodeUrl: true
