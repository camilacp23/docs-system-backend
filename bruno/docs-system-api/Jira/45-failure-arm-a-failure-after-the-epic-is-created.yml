info:
  name: '45 Failure · arm a failure after the Epic is created'
  type: http
  seq: 45
http:
  method: POST
  url: '{{jiraSimUrl}}/__sim/fail-after-create'
  body:
    type: json
    data: |-
      { "level": "EPIC" }
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const simBase = bru.interpolate("{{jiraSimUrl}}"); if (!/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(simBase)) { throw new Error("jiraSimUrl is not local: the request is not sent"); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
