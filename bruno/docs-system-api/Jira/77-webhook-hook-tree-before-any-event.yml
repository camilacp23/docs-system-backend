info:
  name: '77 Webhook · Hook tree before any event'
  type: http
  seq: 77
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrHookId}}/jira-tickets'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        if (res.status === 200) { bru.setVar("jrHookSnap0", JSON.stringify(res.body.data)); }
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("Epic, two Stories, one Subtask each", function () { const d = res.body.data; expect(d.epic.jiraIssueKey).to.equal(v("jrHEpicKey")); expect(d.stories.map(function (s) { return s.jiraIssueKey; })).to.deep.equal([v("jrHS1Key"), v("jrHS2Key")]); expect(d.stories[0].subtasks.map(function (t) { return t.jiraIssueKey; })).to.deep.equal([v("jrHT1Key")]); expect(d.stories[1].subtasks.map(function (t) { return t.jiraIssueKey; })).to.deep.equal([v("jrHT2Key")]); });
settings:
  encodeUrl: true
