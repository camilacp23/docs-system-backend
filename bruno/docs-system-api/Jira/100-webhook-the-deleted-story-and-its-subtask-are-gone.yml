info:
  name: '100 Webhook · the deleted Story and its Subtask are gone'
  type: http
  seq: 100
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrHookId}}/jira-tickets'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        if (res.status === 200) { bru.setVar("jrHookSnap4", JSON.stringify(res.body.data)); }
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the rest of the tree is intact", function () { const d = res.body.data; const exp = JSON.parse(v("jrHookSnap3")); exp.stories = exp.stories.filter(function (s) { return s.jiraIssueKey !== v("jrHS2Key"); }); expect(exp.stories).to.have.length(1); expect(by(d, v("jrHS2Key"))).to.equal(undefined); expect(by(d, v("jrHT2Key"))).to.equal(undefined); expect(d.epic).to.deep.equal(exp.epic); expect(d.stories).to.deep.equal(exp.stories); expect(d.sync.lastSyncedAt).to.equal(by(d, v("jrHT1Key")).lastSyncedAt); });
settings:
  encodeUrl: true
