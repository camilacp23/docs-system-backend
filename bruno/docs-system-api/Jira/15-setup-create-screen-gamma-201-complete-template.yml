info:
  name: '15 Setup · create screen Gamma 201 complete template'
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{jrDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{jrAppId}},
        "name": "{{jrPrefix}}Gamma",
        "miroLink": null,
        "template": {
          "onStart": "Loads the requests of the user",
          "workingProcess": "Lists the requests and filters them by status",
          "architecture": "Gallery plus a detail form",
          "dataModel": "One collection of requests",
          "requirements": "FR-12",
          "knownIssues": "None",
          "risks": "Low"
        },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("jrGammaId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("DRAFT", function () { expect(res.body.data.documentationStatus).to.equal("DRAFT"); });
settings:
  encodeUrl: true
