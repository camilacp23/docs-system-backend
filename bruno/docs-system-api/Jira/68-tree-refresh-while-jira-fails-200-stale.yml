info:
  name: '68 Tree · refresh while Jira fails 200 stale'
  type: http
  seq: 68
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrAlphaId}}/jira-tickets?refresh=true'
  headers:
    - name: Authorization
      value: 'Bearer {{jrDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the local copy with stale true and the circuit still closed", function () { const d = res.body.data; expect(d.sync.stale).to.equal(true); expect(d.sync.jiraAvailable).to.equal(true); expect(d.sync.lastSyncedAt).to.equal(v("jrTreeNewest")); expect(by(d, v("jrAT1Key")).status).to.equal("To Do"); expect(by(d, v("jrAS2Key")).status).to.equal("To Do"); expect(by(d, v("jrAS1Key")).summary).to.equal(v("jrPrefix") + "Alpha story 1"); });
settings:
  encodeUrl: true
