info:
  name: '90 Webhook · the older event changed nothing'
  type: http
  seq: 90
http:
  method: GET
  url: '{{baseUrl}}/screens/{{jrHookId}}/jira-tickets'
  headers:
    - name: Authorization
      value: 'Bearer {{jrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        if (res.status === 200) { bru.setVar("jrHookSnap2", JSON.stringify(res.body.data)); }
    - type: tests
      code: |-
        function all(d) { const r = []; if (d.epic) { r.push(d.epic); } d.stories.forEach(function (s) { r.push(s); s.subtasks.forEach(function (t) { r.push(t); }); }); return r; }
        function by(d, key) { return all(d).filter(function (t) { return t.jiraIssueKey === key; })[0]; }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("still Done, stamped with the newer event", function () { const exp = JSON.parse(v("jrHookSnap1")); const t = by(exp, v("jrHT1Key")); t.status = "Done"; t.statusCategory = "DONE"; t.lastSyncedAt = new Date(Number(v("jrDoneTs"))).toISOString(); exp.sync.lastSyncedAt = t.lastSyncedAt; expect(res.body.data).to.deep.equal(exp); });
settings:
  encodeUrl: true
