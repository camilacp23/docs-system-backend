info:
  name: '125 Cleanup · the simulator has no pending fault'
  type: http
  seq: 125
http:
  method: GET
  url: '{{jiraSimUrl}}/__sim/state'
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const simBase = bru.interpolate("{{jiraSimUrl}}"); if (!/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(simBase)) { throw new Error("jiraSimUrl is not local: the request is not sent"); }
        bru.setVar("jrCallsPrev", bru.getVar("jrCalls"));
    - type: after-response
      code: |-
        const st = res.body;
        function mine(p) { return st.issues.filter(function (i) { return i.summary.indexOf(p) === 0; }); }
        function lv(list, level) { return list.filter(function (i) { return i.level === level; }); }
        function idle() { return st.faults.every(function (f) { return f.remaining === 0; }) && st.failAfterCreate === null && st.pendingCreateFailures === 0; }
        function pre() { return bru.getVar("jrPrefix"); }
        function v(k) { return bru.getVar(k); }
        if (res.status === 200) { bru.setVar("jrCalls", res.body.calls.length); }
    - type: tests
      code: |-
        const st = res.body;
        function mine(p) { return st.issues.filter(function (i) { return i.summary.indexOf(p) === 0; }); }
        function lv(list, level) { return list.filter(function (i) { return i.level === level; }); }
        function idle() { return st.faults.every(function (f) { return f.remaining === 0; }) && st.failAfterCreate === null && st.pendingCreateFailures === 0; }
        function pre() { return bru.getVar("jrPrefix"); }
        function v(k) { return bru.getVar(k); }
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("nothing pending for the next folder or run", function () { expect(idle()).to.equal(true); });
settings:
  encodeUrl: true
