info:
  name: '84 Webhook · signature made with another secret 401'
  type: http
  seq: 84
http:
  method: POST
  url: '{{baseUrl}}/integrations/jira/webhook'
  headers:
    - name: Content-Type
      value: 'application/json'
  body:
    type: json
    data: ''
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require("crypto-js"); const raw = bru.getVar("jrWhRaw"); req.setHeader("X-Hub-Signature", "sha256=" + CryptoJS.HmacSHA256(raw, "not-the-webhook-secret").toString(CryptoJS.enc.Hex)); req.setBody(raw, { raw: true });
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code INVALID_SIGNATURE, message and details", function () { expect(res.body.code).to.equal("INVALID_SIGNATURE"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("exact message", function () { expect(res.body.message).to.equal("Invalid webhook signature."); });
        test("details", function () { expect(res.body.details).to.deep.equal(null); });
settings:
  encodeUrl: true
