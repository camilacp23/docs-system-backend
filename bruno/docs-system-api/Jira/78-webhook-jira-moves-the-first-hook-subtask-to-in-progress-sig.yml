info:
  name: '78 Webhook · Jira moves the first Hook Subtask to In Progress (signed delivery)'
  type: http
  seq: 78
http:
  method: POST
  url: '{{jiraSimUrl}}/__sim/issues/{{jrHT1Key}}/status'
  body:
    type: json
    data: |-
      { "status": "In Progress" }
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const simBase = bru.interpolate("{{jiraSimUrl}}"); if (!/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(simBase)) { throw new Error("jiraSimUrl is not local: the request is not sent"); }
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("jrWhRaw", res.body.rawBody); bru.setVar("jrWhSig", res.body.headers["x-hub-signature"]); bru.setVar("jrWhId", res.body.headers["x-atlassian-webhook-identifier"]); bru.setVar("jrWhTs", res.body.event.timestamp); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the delivery carries a body and a signature", function () { expect(res.body.rawBody).to.be.a("string").and.not.empty; expect(res.body.headers["x-hub-signature"]).to.match(/^sha256=[0-9a-f]{64}$/); expect(JSON.parse(res.body.rawBody)).to.deep.equal(res.body.event); });
settings:
  encodeUrl: true
