info:
  name: '46 Failure · 502 JIRA_PARTIAL_FAILURE after the Epic (Epic message, no storyId)'
  type: http
  seq: 46
http:
  method: POST
  url: '{{baseUrl}}/screens/{{jrBetaId}}/jira-ticket'
  headers:
    - name: Authorization
      value: 'Bearer {{jrDevToken}}'
  body:
    type: json
    data: |-
      { "newStory": { "summary": "{{jrPrefix}}Beta story" }, "subtask": { "summary": "{{jrPrefix}}Beta sub" } }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        function v(k) { return bru.getVar(k); }
        if (res.status === 502) { bru.setVar("jrBEpicKey", res.body.details.key); }
    - type: tests
      code: |-
        function v(k) { return bru.getVar(k); }
        test("status 502", function () { expect(res.status).to.equal(502); });
        test("error body has code JIRA_PARTIAL_FAILURE, message and details", function () { expect(res.body.code).to.equal("JIRA_PARTIAL_FAILURE"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("Epic message and details", function () { const k = res.body.details.key; expect(k).to.match(/^TECHEA-[0-9]+$/); expect(res.body.message).to.equal("The epic " + k + " was created, but the story and the to-do weren't. Try again to add them to that epic."); expect(res.body.details).to.deep.equal({ key: k, created: { epic: k } }); });
settings:
  encodeUrl: true
