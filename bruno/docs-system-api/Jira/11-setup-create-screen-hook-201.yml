info:
  name: '11 Setup · create screen Hook 201'
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{jrDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{jrAppId}}, "name": "{{jrPrefix}}Hook", "miroLink": null, "template": { "onStart": null, "workingProcess": null, "architecture": null, "dataModel": null, "requirements": null, "knownIssues": null, "risks": null }, "components": [], "variableLinks": [], "collectionLinks": [], "navigations": [] }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("jrHookId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the screen belongs to the run application", function () { expect(res.body.data.applicationId).to.equal(bru.getVar("jrAppId")); expect(res.body.data.name).to.equal(bru.getVar("jrPrefix") + "Hook"); });
settings:
  encodeUrl: true
