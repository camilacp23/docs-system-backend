info:
  name: 04 Login 401 (unknown email, same answer)
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "nobody.here@sandbox.local",
        "password": "Wrong-Password-123"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code INVALID_CREDENTIALS, message and details", function () {
          expect(res.body.code).to.equal("INVALID_CREDENTIALS");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("same message as a wrong password", function () { expect(res.body.message).to.equal("The email or password is incorrect."); });
settings:
  encodeUrl: true
