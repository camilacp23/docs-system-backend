info:
  name: 02 Login 400 (invalid body)
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "not-an-email"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields lists the invalid fields", function () {
          expect(res.body.details.fields).to.be.an("array").and.not.empty;
          res.body.details.fields.forEach(function (f) { expect(f).to.include.keys("field", "rule", "message"); });
        });
settings:
  encodeUrl: true
