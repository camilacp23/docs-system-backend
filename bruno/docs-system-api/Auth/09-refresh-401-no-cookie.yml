info:
  name: 09 Refresh 401 (no cookie)
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/auth/refresh'
  headers:
    - name: Origin
      value: '{{origin}}'
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: await bru.cookies.jar().deleteCookies(bru.getEnvVar("baseUrl") + "/auth");
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code REFRESH_INVALID, message and details", function () {
          expect(res.body.code).to.equal("REFRESH_INVALID");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
