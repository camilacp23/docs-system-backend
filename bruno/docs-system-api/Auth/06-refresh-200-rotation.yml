info:
  name: 06 Refresh 200 (rotates the refresh token)
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/auth/refresh'
  headers:
    - name: Origin
      value: '{{origin}}'
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const jar = bru.cookies.jar();
        await jar.setCookie(bru.getEnvVar("baseUrl") + "/auth", { key: "rt", value: bru.getVar("rt1"), path: "/api/v1/auth", secure: true, httpOnly: true });
    - type: after-response
      code: |-
        const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
        if (res.status === 200) {
          bru.setVar("adminToken", res.body.data.accessToken);
          bru.setVar("adminId", res.body.data.user.id);
          bru.setVar("rt2", sc.split(";")[0].slice(3));
        }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("body is a session: Bearer token, expiresIn, sessionExpiresIn and the user without secrets", function () {
          const d = res.body.data;
          expect(d.accessToken).to.be.a("string").and.not.empty;
          expect(d.tokenType).to.equal("Bearer");
          expect(d.expiresIn).to.be.a("number").and.above(0);
          expect(d.sessionExpiresIn).to.be.a("number").and.within(1, 43200);
          expect(d.user).to.include.keys("id", "name", "email", "role", "status");
          expect(d.user).to.not.have.property("passwordHash");
          expect(JSON.stringify(res.body)).to.not.match(/passwordHash|"password"/);
        });
        test("Set-Cookie rt is HttpOnly, Secure, SameSite=Strict and scoped to /api/v1/auth", function () {
          const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
          expect(sc, "rt cookie").to.be.a("string");
          expect(sc).to.include("HttpOnly");
          expect(sc).to.include("Secure");
          expect(sc).to.include("SameSite=Strict");
          expect(sc).to.include("Path=/api/v1/auth");
          expect(sc).to.match(/Expires=/);
        });
        test("session response is not cacheable", function () { expect(res.headers["cache-control"]).to.equal("no-store"); });
        test("the refresh token was rotated", function () {
          expect(bru.getVar("rt2")).to.be.a("string").and.not.empty;
          expect(bru.getVar("rt2")).to.not.equal(bru.getVar("rt1"));
        });
settings:
  encodeUrl: true
