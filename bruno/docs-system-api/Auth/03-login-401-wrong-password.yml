info:
  name: 03 Login 401 (wrong password)
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "Wrong-Password-123"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code INVALID_CREDENTIALS, message and details", function () {
          expect(res.body.code).to.equal("INVALID_CREDENTIALS");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("message does not reveal which part failed", function () { expect(res.body.message).to.equal("The email or password is incorrect."); });
        test("no refresh cookie is issued", function () { expect(res.headers["set-cookie"]).to.be.undefined; });
settings:
  encodeUrl: true
