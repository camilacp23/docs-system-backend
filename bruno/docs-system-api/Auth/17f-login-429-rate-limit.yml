info:
  name: 17.6 Login 429 (the sixth attempt is blocked)
  type: http
  seq: 22
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{rateLimitEmail}}",
        "password": "Wrong-Password-123"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 429", function () { expect(res.status).to.equal(429); });
        test("error body has code RATE_LIMITED, message and details", function () {
          expect(res.body.code).to.equal("RATE_LIMITED");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.minutes and Retry-After agree", function () {
          expect(res.body.details.minutes).to.be.a("number").and.at.least(1);
          const seconds = Number(res.headers["retry-after"]);
          expect(seconds).to.be.at.least(1);
          expect(res.body.details.minutes).to.equal(Math.max(1, Math.ceil(seconds / 60)));
        });
        test("message names the wait", function () { expect(res.body.message).to.equal("Too many attempts. Try again in " + res.body.details.minutes + " minutes."); });
settings:
  encodeUrl: true
