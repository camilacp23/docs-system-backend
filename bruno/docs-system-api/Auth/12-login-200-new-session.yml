info:
  name: 12 Login 200 (new session)
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
        if (res.status === 200) {
          bru.setVar("adminToken", res.body.data.accessToken);
          bru.setVar("adminId", res.body.data.user.id);
          bru.setVar("rt3", sc.split(";")[0].slice(3));
        }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("Set-Cookie rt is HttpOnly, Secure, SameSite=Strict and scoped to /api/v1/auth", function () {
          const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
          expect(sc, "rt cookie").to.be.a("string");
          expect(sc).to.include("HttpOnly");
          expect(sc).to.include("Secure");
          expect(sc).to.include("SameSite=Strict");
          expect(sc).to.include("Path=/api/v1/auth");
          expect(sc).to.match(/Expires=/);
        });
        test("session response is not cacheable", function () { expect(res.headers["cache-control"]).to.equal("no-store"); });
settings:
  encodeUrl: true
