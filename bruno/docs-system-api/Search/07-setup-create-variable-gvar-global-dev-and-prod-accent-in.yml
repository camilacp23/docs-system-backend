info:
  name: '07 Setup · create variable Gvar (GLOBAL, DEV and PROD, accent in the description) 201'
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{seaDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{seaAppId}},
        "name": "{{seaPrefix}}Gvar",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "description": "Configuración del filtro {{seaPrefix}}",
        "environments": [{ "environment": "DEV" }, { "environment": "PROD" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("seaVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("seaVarId")).to.be.a("number"); });
settings:
  encodeUrl: true
