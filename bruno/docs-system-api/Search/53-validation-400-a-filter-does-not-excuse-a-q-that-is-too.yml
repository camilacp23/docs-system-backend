info:
  name: '53 Validation · 400 a filter does not excuse a q that is too short'
  type: http
  seq: 53
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q= a &types=SCREEN'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields).to.have.length(1); expect(res.body.details.fields[0].field).to.equal("q"); expect(res.body.details.fields[0].rule).to.equal("minLength"); });
settings:
  encodeUrl: true
