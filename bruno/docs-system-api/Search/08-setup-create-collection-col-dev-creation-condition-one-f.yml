info:
  name: '08 Setup · create collection Col (DEV, creation condition, one field) 201'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{seaDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{seaAppId}},
        "name": "{{seaPrefix}}Col",
        "creationCondition": "Create {{seaPrefix}}Col from Orders when Active",
        "environments": [{ "environment": "DEV" }],
        "fields": [{ "name": "{{seaPrefix}}Campo", "dataType": "TEXT", "description": null, "position": 1 }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("seaColId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the collection is ready", function () { expect(bru.getVar("seaColId")).to.be.a("number"); });
settings:
  encodeUrl: true
