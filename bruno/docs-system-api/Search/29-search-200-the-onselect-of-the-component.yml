info:
  name: '29 Search · 200 the OnSelect of the component'
  type: http
  seq: 29
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q=to {{seaPrefix}}Pantalla slowly'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that component, found in onSelect", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("COMPONENT"); expect(r.id).to.equal(bru.getVar("seaBtnId")); expect(r.matchedIn).to.equal("onSelect"); expect(r.snippet).to.equal("Navigate to " + bru.getVar("seaPrefix") + "Pantalla slowly"); expect(r.screen.id).to.equal(bru.getVar("seaScrId")); });
settings:
  encodeUrl: true
