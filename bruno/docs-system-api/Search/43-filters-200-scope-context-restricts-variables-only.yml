info:
  name: '43 Filters · 200 scope=CONTEXT restricts variables only'
  type: http
  seq: 43
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&scope=CONTEXT'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const kinds = function (r) { const c = {}; r.body.data.forEach(function (x) { c[x.type] = (c[x.type] || 0) + 1; }); return c; };
        test("no context variable; the screens, the collection and the component unfiltered", function () { expect(kinds(res)).to.deep.equal({ SCREEN: 2, COLLECTION: 1, COMPONENT: 1 }); });
settings:
  encodeUrl: true
