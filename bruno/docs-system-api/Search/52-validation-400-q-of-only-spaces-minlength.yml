info:
  name: '52 Validation · 400 q of only spaces: minLength'
  type: http
  seq: 52
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q=   &pageSize=20'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "q", rule: "minLength", message: "must NOT have fewer than 2 characters" }] }); });
settings:
  encodeUrl: true
