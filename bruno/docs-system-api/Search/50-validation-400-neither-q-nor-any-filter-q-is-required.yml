info:
  name: '50 Validation · 400 neither q nor any filter: q is required'
  type: http
  seq: 50
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details).to.deep.equal({ fields: [{ field: "q", rule: "required", message: "This value is required." }] }); });
settings:
  encodeUrl: true
