info:
  name: '54 Validation · 400 applicationId is required'
  type: http
  seq: 54
http:
  method: GET
  url: '{{baseUrl}}/search?q={{seaPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields[0].field).to.equal("applicationId"); });
settings:
  encodeUrl: true
