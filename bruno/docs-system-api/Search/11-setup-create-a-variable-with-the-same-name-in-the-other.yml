info:
  name: '11 Setup · create a variable with the same name in the other application 201'
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{seaDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{seaOtherAppId}},
        "name": "{{seaPrefix}}Gvar",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("seaOtherVarId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("seaOtherVarId")).to.be.a("number"); });
settings:
  encodeUrl: true
