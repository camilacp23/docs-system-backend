info:
  name: '56 Validation · 400 pageSize 101'
  type: http
  seq: 56
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}&pageSize=101'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields[0].field).to.equal("pageSize"); });
settings:
  encodeUrl: true
