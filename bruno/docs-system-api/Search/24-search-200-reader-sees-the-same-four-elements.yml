info:
  name: '24 Search · 200 Reader sees the same four elements'
  type: http
  seq: 24
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const keys = function (r) { return r.body.data.map(function (x) { return x.type + ":" + x.id; }); };
        test("the same four elements", function () { expect(res.body.total).to.equal(4); expect(keys(res).sort()).to.deep.equal(["VARIABLE:" + bru.getVar("seaVarId"), "COLLECTION:" + bru.getVar("seaColId"), "SCREEN:" + bru.getVar("seaScrId"), "COMPONENT:" + bru.getVar("seaBtnId")].sort()); });
settings:
  encodeUrl: true
