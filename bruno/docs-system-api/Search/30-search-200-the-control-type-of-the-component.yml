info:
  name: '30 Search · 200 the control type of the component'
  type: http
  seq: 30
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}Control'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that component, found in type", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("COMPONENT"); expect(r.id).to.equal(bru.getVar("seaBtnId")); expect(r.matchedIn).to.equal("type"); expect(r.snippet).to.equal(bru.getVar("seaPrefix") + "Control"); });
settings:
  encodeUrl: true
