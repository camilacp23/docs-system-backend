info:
  name: '37 Search · 200 a page beyond the end is empty and keeps the total'
  type: http
  seq: 37
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}&pageSize=2&page=3'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("empty page, total 4", function () { expect(res.body.data).to.deep.equal([]); expect(res.body.total).to.equal(4); expect(res.body.page).to.equal(3); });
settings:
  encodeUrl: true
