info:
  name: '28 Search · 200 the creation condition of the collection'
  type: http
  seq: 28
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}Col from Orders'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that collection, found in creationCondition", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("COLLECTION"); expect(r.id).to.equal(bru.getVar("seaColId")); expect(r.matchedIn).to.equal("creationCondition"); expect(r.snippet).to.equal("Create " + bru.getVar("seaPrefix") + "Col from Orders when Active"); });
settings:
  encodeUrl: true
