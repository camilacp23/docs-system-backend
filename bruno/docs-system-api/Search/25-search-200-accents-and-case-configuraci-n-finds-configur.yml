info:
  name: '25 Search · 200 accents and case: CONFIGURACIÓN finds Configuración in the description (UTF-8)'
  type: http
  seq: 25
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q=CONFIGURACIÓN del filtro {{seaPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that variable, found in description", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("VARIABLE"); expect(r.id).to.equal(bru.getVar("seaVarId")); expect(r.matchedIn).to.equal("description"); expect(r.snippet).to.equal("Configuración del filtro " + bru.getVar("seaPrefix")); });
settings:
  encodeUrl: true
