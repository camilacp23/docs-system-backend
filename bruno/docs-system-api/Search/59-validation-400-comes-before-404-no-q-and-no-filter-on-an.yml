info:
  name: '59 Validation · 400 comes before 404: no q and no filter on an application that does not exist'
  type: http
  seq: 59
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId=999999999'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("code, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.equal("Check the highlighted fields."); expect(res.body.details.fields[0].field).to.equal("q"); expect(res.body.details.fields[0].rule).to.equal("required"); });
settings:
  encodeUrl: true
