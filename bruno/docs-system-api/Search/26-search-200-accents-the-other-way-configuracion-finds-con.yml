info:
  name: '26 Search · 200 accents the other way: configuracion finds Configuración and configuración'
  type: http
  seq: 26
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q=arquitectura de configuracion {{seaPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that screen, found in template", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("SCREEN"); expect(r.id).to.equal(bru.getVar("seaScrId")); expect(r.matchedIn).to.equal("template"); expect(r.snippet).to.equal("Arquitectura de configuración " + bru.getVar("seaPrefix")); });
settings:
  encodeUrl: true
