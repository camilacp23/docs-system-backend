info:
  name: '38 Search · 200 the other application does not leak into this one, nor this one into the other'
  type: http
  seq: 38
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaOtherAppId}}&q={{seaPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only the variable of the other application", function () { expect(res.body.total).to.equal(1); expect(res.body.data[0].type).to.equal("VARIABLE"); expect(res.body.data[0].id).to.equal(bru.getVar("seaOtherVarId")); expect(res.body.data[0].id).to.not.equal(bru.getVar("seaVarId")); });
settings:
  encodeUrl: true
