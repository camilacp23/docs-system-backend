info:
  name: '58 Validation · 404 the application id is outside the integer range'
  type: http
  seq: 58
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId=99999999999&q=abc'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("code, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.equal("This application doesn't exist. It may have been deleted."); expect(res.body.details.element).to.equal("application"); });
settings:
  encodeUrl: true
