info:
  name: '32 Search · 200 usedIn of a screen link returns the linked collection, not the screen'
  type: http
  seq: 32
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&q={{seaPrefix}}OnVisible'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only that collection, found in usedIn", function () { expect(res.body.total).to.equal(1); const r = res.body.data[0]; expect(r.type).to.equal("COLLECTION"); expect(r.id).to.equal(bru.getVar("seaColId")); expect(r.matchedIn).to.equal("usedIn"); expect(r.snippet).to.equal(bru.getVar("seaPrefix") + "OnVisible"); });
settings:
  encodeUrl: true
