info:
  name: '112 Cleanup · only App (OnStart) is left in the run application'
  type: http
  seq: 112
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&types=SCREEN,VARIABLE,COLLECTION,COMPONENT'
  headers:
    - name: Authorization
      value: 'Bearer {{seaReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("one screen and nothing else", function () { expect(res.body.total).to.equal(1); expect(res.body.data[0].type).to.equal("SCREEN"); expect(res.body.data[0].name).to.equal("App (OnStart)"); });
settings:
  encodeUrl: true
