info:
  name: '42 Filters · 200 documentationStatus=APPROVED restricts screens only'
  type: http
  seq: 42
http:
  method: GET
  url: '{{baseUrl}}/search?applicationId={{seaAppId}}&documentationStatus=APPROVED'
  headers:
    - name: Authorization
      value: 'Bearer {{seaAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        const kinds = function (r) { const c = {}; r.body.data.forEach(function (x) { c[x.type] = (c[x.type] || 0) + 1; }); return c; };
        test("no approved screen; the variable, the collection and the component unfiltered", function () { expect(kinds(res)).to.deep.equal({ VARIABLE: 1, COLLECTION: 1, COMPONENT: 1 }); });
settings:
  encodeUrl: true
