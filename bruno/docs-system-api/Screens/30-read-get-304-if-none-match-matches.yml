info:
  name: '30 Read · get 304 if-none-match matches'
  type: http
  seq: 30
http:
  method: GET
  url: '{{baseUrl}}/screens/{{scrCId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrReaderToken}}'
    - name: If-None-Match
      value: '{{scrCEtag}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 304", function () { expect(res.status).to.equal(304); });
        test("no body", function () { expect(res.body === "" || res.body === undefined || res.body === null).to.equal(true); });
        test("the ETag is repeated", function () { expect(res.headers["etag"]).to.equal(bru.getVar("scrCEtag")); });
settings:
  encodeUrl: true
