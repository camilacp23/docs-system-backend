info:
  name: '61 Context · PUT 200 Alpha omits the origin row and it survives (D-84)'
  type: http
  seq: 61
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrAId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{scrPrefix}}Alpha",
        "miroLink": null,
        "template": {
          "onStart": "Alpha starts here",
          "workingProcess": null,
          "architecture": null,
          "dataModel": null,
          "requirements": null,
          "knownIssues": null,
          "risks": "Alpha risks"
        },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("scrAEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the change was saved and the status stays DRAFT", function () { expect(res.body.data.template.risks).to.equal("Alpha risks"); expect(res.body.data.documentationStatus).to.equal("DRAFT"); });
        test("the origin row is still there", function () { const l = res.body.data.variableLinks; expect(l).to.have.length(1); expect(l[0].isOrigin).to.equal(true); expect(l[0].variable.id).to.equal(Number(bru.getVar("scrCtxAId"))); });
settings:
  encodeUrl: true
