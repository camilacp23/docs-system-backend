info:
  name: '42 Update · 404 nested component id of another screen (D-75)'
  type: http
  seq: 42
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrAId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{scrPrefix}}Alpha",
        "miroLink": null,
        "template": {
          "onStart": "Alpha starts here",
          "workingProcess": null,
          "architecture": null,
          "dataModel": null,
          "requirements": null,
          "knownIssues": null,
          "risks": null
        },
        "components": [
          {
            "id": {{scrCBtnId}},
            "name": "btnStolen",
            "type": "Button"
          }
        ],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("details name the element, the id and the field", function () { expect(res.body.details).to.deep.equal({ element: "component", id: Number(bru.getVar("scrCBtnId")), field: "components[0].id" }); });
settings:
  encodeUrl: true
