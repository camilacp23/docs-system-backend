info:
  name: '73 Workflow · review 403 Developer'
  type: http
  seq: 73
http:
  method: POST
  url: '{{baseUrl}}/screens/{{scrCId}}/review'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "decision": "APPROVE"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("error body has code FORBIDDEN, message and details", function () { expect(res.body.code).to.equal("FORBIDDEN"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("the roles that may do it are listed", function () { expect(res.body.details.requiredRoles).to.have.members(["ADMINISTRATOR"]); });
settings:
  encodeUrl: true
