info:
  name: '102 Delete · 404 twice'
  type: http
  seq: 102
http:
  method: DELETE
  url: '{{baseUrl}}/screens/{{scrBId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details name the missing element", function () { expect(res.body.message).to.equal("This screen doesn't exist. It may have been deleted."); expect(res.body.details.element).to.equal("screen"); expect(res.body.details.id).to.equal(Number(bru.getVar("scrBId"))); });
settings:
  encodeUrl: true
