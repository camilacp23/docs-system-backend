info:
  name: 05 List 200 (sort -name keeps App (OnStart) first)
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}&sort=-name'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("App (OnStart) first, then B and A", function () {
          expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["App (OnStart)", "Sandbox Screen B", "Sandbox Screen A"]);
        });
settings:
  encodeUrl: true
