info:
  name: 02 List 401 (no token)
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function () { expect(res.status).to.equal(401); });
        test("error body has code UNAUTHENTICATED, message and details", function () {
          expect(res.body.code).to.equal("UNAUTHENTICATED");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
