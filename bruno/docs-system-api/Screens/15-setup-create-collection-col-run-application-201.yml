info:
  name: '15 Setup · create collection Col (run application) 201'
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{scrAppId}},
        "name": "{{scrPrefix}}Col",
        "environments": [
          {
            "environment": "DEV"
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("scrColId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the collection is ready", function () { expect(bru.getVar("scrColId")).to.be.a("number"); });
settings:
  encodeUrl: true
