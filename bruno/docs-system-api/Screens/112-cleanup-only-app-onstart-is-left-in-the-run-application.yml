info:
  name: '112 Cleanup · only App (OnStart) is left in the run application'
  type: http
  seq: 112
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{scrAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("total", function () { expect(res.body.total).to.equal(1); });
        test("it is App (OnStart)", function () { expect(res.body.data[0].name).to.equal("App (OnStart)"); });
settings:
  encodeUrl: true
