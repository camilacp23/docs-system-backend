info:
  name: '35 Update · 200 swapping the names of two components'
  type: http
  seq: 35
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrCId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
    - name: If-Match
      value: '{{scrCEtag}}'
  body:
    type: json
    data: |-
      {
        "name": "{{scrPrefix}}Gamma",
        "miroLink": null,
        "template": {
          "onStart": "Loads the requests of the user",
          "workingProcess": "Lists the requests and filters them by status",
          "architecture": "Gallery plus a detail form",
          "dataModel": "One collection of requests",
          "requirements": "FR-10",
          "knownIssues": "None",
          "risks": "Low"
        },
        "components": [
          {
            "id": {{scrCBtnId}},
            "name": "lblName",
            "type": "Button",
            "onSelect": "Navigate(Alpha)",
            "description": null,
            "uses": [
              {
                "id": {{scrCUse1Id}},
                "targetType": "VARIABLE",
                "targetId": {{scrGlobId}},
                "description": "reads"
              }
            ]
          },
          {
            "id": {{scrCLblId}},
            "name": "btnGo",
            "type": "Label",
            "onSelect": null,
            "description": null,
            "uses": [
              {
                "id": {{scrCUse2Id}},
                "targetType": "COLLECTION",
                "targetId": {{scrColId}},
                "description": null
              }
            ]
          }
        ],
        "variableLinks": [
          {
            "id": {{scrCVarLinkId}},
            "variableId": {{scrGlobId}},
            "accessMode": "READ",
            "usedIn": "lblName.Text"
          }
        ],
        "collectionLinks": [
          {
            "id": {{scrCColLinkId}},
            "collectionId": {{scrColId}},
            "accessMode": "READ",
            "usedIn": "galItems.Items"
          }
        ],
        "navigations": [
          {
            "id": {{scrCNavId}},
            "targetScreenId": {{scrAId}},
            "description": "Back"
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("scrCEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("each component kept its id and took the other name", function () { const c = res.body.data.components; expect(c.find(function (x) { return x.id === Number(bru.getVar("scrCBtnId")); }).name).to.equal("lblName"); expect(c.find(function (x) { return x.id === Number(bru.getVar("scrCLblId")); }).name).to.equal("btnGo"); expect(c).to.have.length(2); });
        test("the uses kept their ids", function () { const c = res.body.data.components; expect(c.find(function (x) { return x.id === Number(bru.getVar("scrCBtnId")); }).uses[0].id).to.equal(Number(bru.getVar("scrCUse1Id"))); });
        test("the status stays DRAFT", function () { expect(res.body.data.documentationStatus).to.equal("DRAFT"); });
settings:
  encodeUrl: true
