info:
  name: '75 Workflow · Gamma DRAFT to IN_PROGRESS 200 with If-Match'
  type: http
  seq: 75
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrCId}}/status'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
    - name: If-Match
      value: '{{scrCEtag}}'
  body:
    type: json
    data: |-
      {
        "status": "IN_PROGRESS"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("scrCPrev", bru.getVar("scrCEtag")); bru.setVar("scrCEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the status is IN_PROGRESS", function () { expect(res.body.data.documentationStatus).to.equal("IN_PROGRESS"); });
        test("the ETag is new (D-88)", function () { expect(res.headers["etag"]).to.match(/^W\/"\d+-\d+-\d+-[0-9a-f]{8}"$/); expect(res.headers["etag"]).to.not.equal(bru.getVar("scrCPrev")); });
settings:
  encodeUrl: true
