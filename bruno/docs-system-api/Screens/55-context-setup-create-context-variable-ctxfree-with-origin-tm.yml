info:
  name: '55 Context · setup · create context variable CtxFree with origin Tmp 201'
  type: http
  seq: 55
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{scrAppId}},
        "name": "{{scrPrefix}}CtxFree",
        "dataType": "TEXT",
        "scope": "CONTEXT",
        "originScreenId": {{scrTmpId}},
        "environments": [
          {
            "environment": "DEV"
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("scrCtxFreeId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the origin is Tmp", function () { expect(res.body.data.originScreen.id).to.equal(Number(bru.getVar("scrTmpId"))); });
settings:
  encodeUrl: true
