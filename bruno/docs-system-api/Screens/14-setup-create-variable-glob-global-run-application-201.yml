info:
  name: '14 Setup · create variable Glob (GLOBAL, run application) 201'
  type: http
  seq: 14
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{scrAppId}},
        "name": "{{scrPrefix}}Glob",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [
          {
            "environment": "DEV"
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("scrGlobId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("scrGlobId")).to.be.a("number"); });
settings:
  encodeUrl: true
