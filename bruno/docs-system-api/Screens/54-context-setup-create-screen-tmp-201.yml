info:
  name: '54 Context · setup · create screen Tmp 201'
  type: http
  seq: 54
http:
  method: POST
  url: '{{baseUrl}}/screens'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{scrAppId}},
        "name": "{{scrPrefix}}Tmp",
        "miroLink": null,
        "template": {
          "onStart": null,
          "workingProcess": null,
          "architecture": null,
          "dataModel": null,
          "requirements": null,
          "knownIssues": null,
          "risks": null
        },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": []
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("scrTmpId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the screen is ready", function () { expect(bru.getVar("scrTmpId")).to.be.a("number"); });
settings:
  encodeUrl: true
