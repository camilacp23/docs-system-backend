info:
  name: 04 List 200 (filter q)
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}&q=Screen B'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only the screen that matches", function () {
          expect(res.body.total).to.equal(1);
          expect(res.body.data).to.have.length(1);
          expect(res.body.data[0].id).to.equal(Number(bru.interpolate("{{screenBId}}")));
          expect(res.body.data[0].name).to.equal("Sandbox Screen B");
        });
settings:
  encodeUrl: true
