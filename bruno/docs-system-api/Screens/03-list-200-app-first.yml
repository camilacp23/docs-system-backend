info:
  name: 03 List 200 (App (OnStart) first, then by name)
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("collection envelope with the three screens", function () {
          expect(res.body).to.include.keys("data", "page", "pageSize", "total");
          expect(res.body.page).to.equal(1);
          expect(res.body.pageSize).to.equal(20);
          expect(res.body.total).to.equal(3);
          expect(res.body.data).to.have.length(3);
        });
        test("App (OnStart) is first, then Sandbox Screen A and B", function () {
          const d = res.body.data;
          expect(d.map(function (x) { return x.name; })).to.deep.equal(["App (OnStart)", "Sandbox Screen A", "Sandbox Screen B"]);
          expect(d.map(function (x) { return x.isAppContext; })).to.deep.equal([true, false, false]);
        });
        test("each item has the screen summary shape", function () {
          res.body.data.forEach(function (x) {
            expect(x).to.include.keys("id", "applicationId", "name", "isAppContext", "documentationStatus", "author", "pendingSubtasks", "commentCount", "createdAt", "updatedAt");
            expect(x.applicationId).to.equal(Number(bru.interpolate("{{fixturesAppId}}")));
            expect(x.documentationStatus).to.equal("UNDOCUMENTED");
            expect(x.pendingSubtasks).to.equal(0);
            expect(x.commentCount).to.equal(0);
          });
          expect(res.body.data[1].id).to.equal(Number(bru.interpolate("{{screenAId}}")));
          expect(res.body.data[2].id).to.equal(Number(bru.interpolate("{{screenBId}}")));
          expect(res.body.data[1].author.name).to.equal("Sandbox Administrator");
        });
settings:
  encodeUrl: true
