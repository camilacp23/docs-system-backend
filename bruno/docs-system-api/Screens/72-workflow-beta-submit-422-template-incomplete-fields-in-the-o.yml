info:
  name: '72 Workflow · Beta submit 422 TEMPLATE_INCOMPLETE (fields in the order of Table 28)'
  type: http
  seq: 72
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrBId}}/status'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "status": "IN_REVIEW"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code TEMPLATE_INCOMPLETE, message and details", function () { expect(res.body.code).to.equal("TEMPLATE_INCOMPLETE"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details.fields", function () { expect(res.body.details).to.deep.equal({ fields: ["onStart", "workingProcess", "dataModel", "requirements", "knownIssues"] }); expect(res.body.message).to.equal("Complete all seven template fields to submit for review. Missing: onStart, workingProcess, dataModel, requirements, knownIssues."); });
settings:
  encodeUrl: true
