info:
  name: '81 Workflow · review RETURN without comment 400'
  type: http
  seq: 81
http:
  method: POST
  url: '{{baseUrl}}/screens/{{scrCId}}/review'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  body:
    type: json
    data: |-
      {
        "decision": "RETURN"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("details.fields is not empty", function () { expect(res.body.details.fields).to.be.an("array").and.not.empty; });
settings:
  encodeUrl: true
