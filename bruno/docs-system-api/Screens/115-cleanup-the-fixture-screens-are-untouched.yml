info:
  name: '115 Cleanup · the fixture screens are untouched'
  type: http
  seq: 115
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("total", function () { expect(res.body.total).to.equal(3); });
        test("all UNDOCUMENTED, no new screen", function () { expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["App (OnStart)", "Sandbox Screen A", "Sandbox Screen B"]); res.body.data.forEach(function (x) { expect(x.documentationStatus).to.equal("UNDOCUMENTED"); }); });
settings:
  encodeUrl: true
