info:
  name: '13 Setup · App (OnStart) screen of the run application'
  type: http
  seq: 13
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{scrAppId}}&q=App'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("scrAppScreenId", res.body.data[0].id); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the first screen is App (OnStart)", function () { expect(res.body.data[0].name).to.equal("App (OnStart)"); expect(res.body.data[0].isAppContext).to.equal(true); });
settings:
  encodeUrl: true
