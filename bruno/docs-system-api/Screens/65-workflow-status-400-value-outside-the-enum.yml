info:
  name: '65 Workflow · status 400 value outside the enum'
  type: http
  seq: 65
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrCId}}/status'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "status": "APPROVED"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("details.fields names status", function () { expect(res.body.details.fields.map(function (f) { return f.field; }).join(" ")).to.include("status"); });
settings:
  encodeUrl: true
