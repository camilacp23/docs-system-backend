info:
  name: '12 Setup · create the run application 201'
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/applications'
  headers:
    - name: Authorization
      value: 'Bearer {{scrAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Screens {{scrRun}}",
        "platform": "Power Apps"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("scrAppId", res.body.data.id); bru.setVar("scrAppName", res.body.data.name); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the run application is ready", function () { expect(bru.getVar("scrAppId")).to.be.a("number"); });
settings:
  encodeUrl: true
