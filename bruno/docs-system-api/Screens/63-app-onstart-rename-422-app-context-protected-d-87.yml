  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code APP_CONTEXT_PROTECTED, message and details", function () { expect(res.body.code).to.equal("APP_CONTEXT_PROTECTED"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("The App (OnStart) screen can't be renamed."); expect(res.body.details).to.equal(null); });
settings:
