info:
  name: '29 Read · get 200 as Reader'
  type: http
  seq: 29
http:
  method: GET
  url: '{{baseUrl}}/screens/{{scrCId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("body is the screen", function () { const d = res.body.data; expect(d.id).to.equal(Number(bru.getVar("scrCId"))); expect(d.name).to.equal(bru.getVar("scrPrefix") + "Gamma"); expect(d.documentationStatus).to.equal("DRAFT"); expect(d.template).to.deep.equal({"onStart":"Loads the requests of the user","workingProcess":"Lists the requests and filters them by status","architecture":"Gallery plus a detail form","dataModel":"One collection of requests","requirements":"FR-10","knownIssues":"None","risks":"Low"}); expect(res.body.data).to.not.have.any.keys("passwordHash"); });
        test("the ETag is the one of the creation", function () { expect(res.headers["etag"]).to.equal(bru.getVar("scrCEtag")); });
        test("components, links and navigation", function () { const d = res.body.data; expect(d.components).to.have.length(2); expect(d.variableLinks).to.have.length(1); expect(d.collectionLinks).to.have.length(1); expect(d.navigations).to.have.length(1); });
settings:
  encodeUrl: true
