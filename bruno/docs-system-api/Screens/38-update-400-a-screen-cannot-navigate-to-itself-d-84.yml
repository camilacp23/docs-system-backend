info:
  name: '38 Update · 400 a screen cannot navigate to itself (D-84)'
  type: http
  seq: 38
http:
  method: PUT
  url: '{{baseUrl}}/screens/{{scrAId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{scrDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{scrPrefix}}Alpha",
        "miroLink": null,
        "template": {
          "onStart": "Alpha starts here",
          "workingProcess": null,
          "architecture": null,
          "dataModel": null,
          "requirements": null,
          "knownIssues": null,
          "risks": null
        },
        "components": [],
        "variableLinks": [],
        "collectionLinks": [],
        "navigations": [
          {
            "targetScreenId": {{scrAId}}
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("details.fields names the position", function () { expect(res.body.details.fields.map(function (f) { return [f.field, f.rule]; })).to.deep.equal([["navigations[0].targetScreenId", "self"]]); });
        test("message of the rule", function () { expect(res.body.details.fields[0].message).to.equal("A screen cannot navigate to itself."); });
settings:
  encodeUrl: true
