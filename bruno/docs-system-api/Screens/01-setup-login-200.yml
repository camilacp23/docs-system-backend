info:
  name: 01 Setup · administrator login 200
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("scrAdminToken", res.body.data.accessToken); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a token is ready", function () { expect(bru.getVar("scrAdminToken")).to.be.a("string").and.not.empty; });
settings:
  encodeUrl: true
