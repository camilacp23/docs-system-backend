info:
  name: '41 Fields 304 (If-None-Match matches)'
  type: http
  seq: 41
http:
  method: GET
  url: '{{baseUrl}}/collections/{{varColAId}}/fields'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
    - name: If-None-Match
      value: '{{varFieldsEtag}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 304", function () { expect(res.status).to.equal(304); });
        test("no body", function () { expect(res.body === "" || res.body === undefined || res.body === null).to.equal(true); });
settings:
  encodeUrl: true
