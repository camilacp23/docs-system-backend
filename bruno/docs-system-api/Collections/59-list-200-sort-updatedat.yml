info:
  name: '59 List 200 (sort -updatedAt)'
  type: http
  seq: 59
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId={{fixturesAppId}}&q={{varPrefix}}&sort=-updatedAt'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the most recently updated first", function () { expect(res.body.data.map(function (c) { return c.name; })).to.deep.equal([bru.getVar("varPrefix") + "ColA", bru.getVar("varPrefix") + "ColB"]); });
settings:
  encodeUrl: true
