info:
  name: '103 Omit · the variable lists the assignment of ColE'
  type: http
  seq: 103
http:
  method: GET
  url: '{{baseUrl}}/variables/{{varGlobId}}/dependencies'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("one assignment, from ColE", function () { expect(res.body.data.collections).to.have.length(1); expect(res.body.data.collections[0].collection).to.deep.equal({ id: Number(bru.interpolate("{{varColEId}}")), name: bru.getVar("varPrefix") + "ColE" }); });
settings:
  encodeUrl: true
