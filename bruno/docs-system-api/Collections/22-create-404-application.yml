info:
  name: '22 Create 404 (application)'
  type: http
  seq: 22
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": 999999, "name": "{{varPrefix}}Ghost", "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details name the missing element", function () { expect(res.body.message).to.equal("This application doesn't exist. It may have been deleted."); expect(res.body.details.element).to.equal("application"); expect(res.body.details.id).to.equal(999999); });
settings:
  encodeUrl: true
