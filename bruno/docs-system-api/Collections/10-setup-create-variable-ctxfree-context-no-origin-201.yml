info:
  name: '10 Setup · create variable CtxFree (CONTEXT, no origin) 201'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}CtxFree", "dataType": "TEXT", "scope": "CONTEXT", "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("varCtxFreeId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("varCtxFreeId")).to.be.a("number"); });
settings:
  encodeUrl: true
