info:
  name: '80 Update 422 (CONTEXT_SCREEN_MISMATCH with origin)'
  type: http
  seq: 80
http:
  method: PUT
  url: '{{baseUrl}}/collections/{{varColAId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{varPrefix}}ColA",
        "creationCondition": "ClearCollect on entering the screen",
        "description": "Main collection of the run",
        "environments": [{ "environment": "DEV", "notes": "Dev note" }, { "environment": "PROD", "notes": "Prod note" }],
        "fields": [{ "id": {{varFieldIdId}}, "name": "FullName", "dataType": "NUMBER", "position": 0 }, { "id": {{varFieldNameId}}, "name": "Id", "dataType": "TEXT", "description": "Display name", "position": 1 }, { "id": {{varFieldNewId}}, "name": "CreatedAt", "dataType": "DATE_TIME", "position": 2 }],
        "variableAssignments": [{ "variableId": {{varCtxId}}, "screenId": {{screenBId}}, "assignmentFunction": "UPDATE_CONTEXT", "tableFunction": null, "usedIn": "OnVisible" }],
        "derivedFrom": [{{varColBId}}]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code CONTEXT_SCREEN_MISMATCH, message and details", function () { expect(res.body.code).to.equal("CONTEXT_SCREEN_MISMATCH"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal(bru.getVar("varPrefix") + "Ctx belongs to Sandbox Screen A. From here you can only write it with Navigate."); expect(res.body.details).to.deep.equal({ variableId: Number(bru.interpolate("{{varCtxId}}")), variable: bru.getVar("varPrefix") + "Ctx", originScreenId: Number(bru.interpolate("{{screenAId}}")), screen: "Sandbox Screen A", screenId: Number(bru.interpolate("{{screenBId}}")), targetScreen: "Sandbox Screen B", field: "variableAssignments[0].screenId" }); });
settings:
  encodeUrl: true
