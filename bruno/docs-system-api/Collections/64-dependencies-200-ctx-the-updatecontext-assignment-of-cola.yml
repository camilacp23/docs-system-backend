info:
  name: '64 Dependencies 200 (Ctx: the UpdateContext assignment of ColA)'
  type: http
  seq: 64
http:
  method: GET
  url: '{{baseUrl}}/variables/{{varCtxId}}/dependencies'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the assignment of the collection is listed", function () { expect(res.body.data.collections).to.have.length(1); const c = res.body.data.collections[0]; expect(c.collection).to.deep.equal({ id: Number(bru.interpolate("{{varColAId}}")), name: bru.getVar("varPrefix") + "ColA" }); expect(c.variable.id).to.equal(Number(bru.interpolate("{{varCtxId}}"))); expect(c.screen).to.deep.equal({ id: Number(bru.interpolate("{{screenAId}}")), name: "Sandbox Screen A" }); expect(c.assignmentFunction).to.equal("UPDATE_CONTEXT"); expect(c.tableFunction).to.equal(null); expect(c.usedIn).to.equal("btnSave.OnSelect"); });
settings:
  encodeUrl: true
