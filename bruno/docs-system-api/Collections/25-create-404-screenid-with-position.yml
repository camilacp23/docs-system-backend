info:
  name: '25 Create 404 (screenId, with position)'
  type: http
  seq: 25
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Ghost", "environments": [{ "environment": "DEV" }], "variableAssignments": [{ "variableId": {{varGlobId}}, "screenId": 999999, "assignmentFunction": "SET", "usedIn": "OnVisible" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details name the missing element and its position", function () { expect(res.body.message).to.equal("This screen doesn't exist. It may have been deleted."); expect(res.body.details.element).to.equal("screen"); expect(res.body.details.field).to.equal("variableAssignments[0].screenId"); expect(res.body.details.id).to.equal(999999); });
settings:
  encodeUrl: true
