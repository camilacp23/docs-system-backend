info:
  name: '50 List 404 (application out of range, D-70)'
  type: http
  seq: 50
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId=99999999999'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () { expect(res.body.code).to.equal("NOT_FOUND"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details name the missing element", function () { expect(res.body.message).to.equal("This application doesn't exist. It may have been deleted."); expect(res.body.details.element).to.equal("application");  });
settings:
  encodeUrl: true
