info:
  name: '60 List 200 (pagination)'
  type: http
  seq: 60
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId={{fixturesAppId}}&q={{varPrefix}}&page=2&pageSize=1'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("second page of one", function () { expect(res.body.page).to.equal(2); expect(res.body.pageSize).to.equal(1); expect(res.body.total).to.equal(2); expect(res.body.data.map(function (c) { return c.name; })).to.deep.equal([bru.getVar("varPrefix") + "ColB"]); });
settings:
  encodeUrl: true
