info:
  name: '53 List 200 (environment PROD)'
  type: http
  seq: 53
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId={{fixturesAppId}}&q={{varPrefix}}&environment=PROD'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("only ColA is in PROD", function () { expect(res.body.total).to.equal(1); expect(res.body.data[0].name).to.equal(bru.getVar("varPrefix") + "ColA"); expect(res.body.data[0].environments).to.have.members(["DEV", "PROD"]); });
settings:
  encodeUrl: true
