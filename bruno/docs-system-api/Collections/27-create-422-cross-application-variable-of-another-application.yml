info:
  name: '27 Create 422 (CROSS_APPLICATION: variable of another application)'
  type: http
  seq: 27
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Ghost", "environments": [{ "environment": "DEV" }], "variableAssignments": [{ "variableId": {{varRunVarId}}, "screenId": {{screenAId}}, "assignmentFunction": "SET", "tableFunction": null, "usedIn": "OnVisible" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code CROSS_APPLICATION, message and details", function () { expect(res.body.code).to.equal("CROSS_APPLICATION"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("You can only link elements of the same application."); expect(res.body.details).to.deep.equal({ field: "variableAssignments[0].variableId" }); });
settings:
  encodeUrl: true
