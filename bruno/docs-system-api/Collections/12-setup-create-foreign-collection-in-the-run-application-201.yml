info:
  name: '12 Setup · create Foreign collection in the run application 201'
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{varAppId}}, "name": "{{varPrefix}}Foreign", "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("varForeignId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the collection is ready", function () { expect(bru.getVar("varForeignId")).to.be.a("number"); });
settings:
  encodeUrl: true
