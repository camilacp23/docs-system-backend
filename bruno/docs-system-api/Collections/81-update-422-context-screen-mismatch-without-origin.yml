info:
  name: '81 Update 422 (CONTEXT_SCREEN_MISMATCH without origin)'
  type: http
  seq: 81
http:
  method: PUT
  url: '{{baseUrl}}/collections/{{varColAId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{varPrefix}}ColA",
        "creationCondition": "ClearCollect on entering the screen",
        "description": "Main collection of the run",
        "environments": [{ "environment": "DEV", "notes": "Dev note" }, { "environment": "PROD", "notes": "Prod note" }],
        "fields": [{ "id": {{varFieldIdId}}, "name": "FullName", "dataType": "NUMBER", "position": 0 }, { "id": {{varFieldNameId}}, "name": "Id", "dataType": "TEXT", "description": "Display name", "position": 1 }, { "id": {{varFieldNewId}}, "name": "CreatedAt", "dataType": "DATE_TIME", "position": 2 }],
        "variableAssignments": [{ "variableId": {{varCtxFreeId}}, "screenId": {{screenAId}}, "assignmentFunction": "UPDATE_CONTEXT", "tableFunction": null, "usedIn": "OnVisible" }],
        "derivedFrom": [{{varColBId}}]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code CONTEXT_SCREEN_MISMATCH, message and details", function () { expect(res.body.code).to.equal("CONTEXT_SCREEN_MISMATCH"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal(bru.getVar("varPrefix") + "CtxFree has no origin screen. Set its origin screen before linking it."); expect(res.body.details).to.deep.equal({ variableId: Number(bru.interpolate("{{varCtxFreeId}}")), variable: bru.getVar("varPrefix") + "CtxFree", originScreenId: null, screenId: Number(bru.interpolate("{{screenAId}}")), targetScreen: "Sandbox Screen A", field: "variableAssignments[0].screenId" }); });
settings:
  encodeUrl: true
