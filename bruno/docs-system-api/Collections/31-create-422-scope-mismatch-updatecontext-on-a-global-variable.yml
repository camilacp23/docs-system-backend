info:
  name: '31 Create 422 (SCOPE_MISMATCH: UpdateContext on a global variable, second item)'
  type: http
  seq: 31
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Ghost", "environments": [{ "environment": "DEV" }], "variableAssignments": [{ "variableId": {{varGlobId}}, "screenId": {{screenAId}}, "assignmentFunction": "SET", "tableFunction": null, "usedIn": "OnStart" }, { "variableId": {{varGlobId}}, "screenId": {{screenAId}}, "assignmentFunction": "UPDATE_CONTEXT", "tableFunction": null, "usedIn": "OnVisible" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code SCOPE_MISMATCH, message and details", function () { expect(res.body.code).to.equal("SCOPE_MISMATCH"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("message and details", function () { expect(res.body.message).to.equal("Set applies to global variables and UpdateContext to context variables."); expect(res.body.details).to.deep.equal({ field: "variableAssignments[1].assignmentFunction" }); });
settings:
  encodeUrl: true
