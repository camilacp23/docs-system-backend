info:
  name: '18 Create 400 (repeated environment names its position)'
  type: http
  seq: 18
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Dup", "environments": [{ "environment": "DEV", "notes": "a" }, { "environment": "DEV", "notes": "b" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () { expect(res.body.code).to.equal("VALIDATION_ERROR"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("details.fields names the position", function () { expect(res.body.details.fields.map(function (f) { return [f.field, f.rule]; })).to.deep.equal([["environments[1].environment", "unique"]]); });
settings:
  encodeUrl: true
