info:
  name: '91 Archived · unarchive the run application 200'
  type: http
  seq: 91
http:
  method: PUT
  url: '{{baseUrl}}/applications/{{varAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varAdminToken}}'
  body:
    type: json
    data: |-
      { "name": "{{varAppName}}", "platform": "Power Apps", "status": "ACTIVE" }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the application is active again", function () { expect(res.body.data.status).to.equal("ACTIVE"); });
settings:
  encodeUrl: true
