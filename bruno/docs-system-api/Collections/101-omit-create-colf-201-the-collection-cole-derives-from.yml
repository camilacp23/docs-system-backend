info:
  name: '101 Omit · create ColF 201 (the collection ColE derives from)'
  type: http
  seq: 101
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}ColF", "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("varColFId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the collection is ready", function () { expect(bru.getVar("varColFId")).to.be.a("number"); });
settings:
  encodeUrl: true
