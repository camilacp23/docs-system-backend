info:
  name: '42 Fields 200 (pagination)'
  type: http
  seq: 42
http:
  method: GET
  url: '{{baseUrl}}/collections/{{varColAId}}/fields?page=2&pageSize=2'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("second page of two", function () { expect(res.body.page).to.equal(2); expect(res.body.pageSize).to.equal(2); expect(res.body.total).to.equal(3); expect(res.body.data.map(function (f) { return f.name; })).to.deep.equal(["Status"]); });
settings:
  encodeUrl: true
