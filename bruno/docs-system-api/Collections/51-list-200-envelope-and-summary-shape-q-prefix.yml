info:
  name: '51 List 200 (envelope and summary shape, q=prefix)'
  type: http
  seq: 51
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId={{fixturesAppId}}&q={{varPrefix}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("varListEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("collection envelope", function () { expect(res.body).to.include.keys("data", "page", "pageSize", "total"); expect(res.body.page).to.equal(1); expect(res.body.pageSize).to.equal(20); expect(res.body.total).to.equal(2); });
        test("sorted by name", function () { expect(res.body.data.map(function (c) { return c.name; })).to.deep.equal([bru.getVar("varPrefix") + "ColA", bru.getVar("varPrefix") + "ColB"]); });
        test("each item has the summary shape", function () { res.body.data.forEach(function (c) { expect(c).to.include.keys("id", "applicationId", "name", "environments", "documented", "fieldCount", "createdAt", "updatedAt"); expect(c).to.not.have.any.keys("fields", "variableAssignments", "derivedFrom", "creationCondition", "description", "environmentDetails"); expect(c.documented).to.equal(false); }); expect(res.body.data.map(function (c) { return c.fieldCount; })).to.deep.equal([3, 1]); });
        test("the list has an ETag", function () { expect(res.headers["etag"]).to.be.a("string").and.not.empty; });
settings:
  encodeUrl: true
