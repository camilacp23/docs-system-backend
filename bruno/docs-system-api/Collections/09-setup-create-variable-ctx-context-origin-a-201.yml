info:
  name: '09 Setup · create variable Ctx (CONTEXT, origin A) 201'
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Ctx", "dataType": "TEXT", "scope": "CONTEXT", "originScreenId": {{screenAId}}, "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) { bru.setVar("varCtxId", res.body.data.id); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("the variable is ready", function () { expect(bru.getVar("varCtxId")).to.be.a("number"); });
settings:
  encodeUrl: true
