info:
  name: '21 Create 403 (reader)'
  type: http
  seq: 21
http:
  method: POST
  url: '{{baseUrl}}/collections'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  body:
    type: json
    data: |-
      { "applicationId": {{fixturesAppId}}, "name": "{{varPrefix}}Reader", "environments": [{ "environment": "DEV" }] }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("error body has code FORBIDDEN, message and details", function () { expect(res.body.code).to.equal("FORBIDDEN"); expect(res.body.message).to.be.a("string").and.not.empty; expect(res.body).to.have.property("details"); });
        test("the roles that may do it are listed", function () { expect(res.body.details.requiredRoles).to.have.members(["ADMINISTRATOR", "DEVELOPER"]); });
settings:
  encodeUrl: true
