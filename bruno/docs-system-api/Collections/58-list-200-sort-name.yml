info:
  name: '58 List 200 (sort -name)'
  type: http
  seq: 58
http:
  method: GET
  url: '{{baseUrl}}/collections?applicationId={{fixturesAppId}}&q={{varPrefix}}&sort=-name'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("descending", function () { expect(res.body.data.map(function (c) { return c.name; })).to.deep.equal([bru.getVar("varPrefix") + "ColB", bru.getVar("varPrefix") + "ColA"]); });
settings:
  encodeUrl: true
