info:
  name: 03 Create developer 201
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/users'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Run Developer",
        "email": "dev-{{runId}}@sandbox.local",
        "password": "Sandbox-Pass-2026",
        "role": "DEVELOPER"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: if (res.status === 201) { bru.setVar("devId", res.body.data.id); bru.setVar("devEtag", res.headers["etag"]); }
    - type: tests
      code: |-
        test("status 201", function () { expect(res.status).to.equal(201); });
        test("body is the created user", function () {
          const d = res.body.data;
          expect(d).to.include.keys("id", "name", "email", "role", "status", "lastLoginAt", "createdAt", "updatedAt");
          expect(d).to.not.have.property("passwordHash");
          expect(d.role).to.equal("DEVELOPER");
          expect(d.status).to.equal("ACTIVE");
          expect(d.email).to.equal("dev-" + bru.getVar("runId") + "@sandbox.local");
        });
        test("Location points to the new user", function () { expect(res.headers["location"]).to.equal("/api/v1/users/" + res.body.data.id); });
        test("ETag is a weak validator", function () { expect(res.headers["etag"]).to.match(/^W\/"\d+"$/); });
settings:
  encodeUrl: true
