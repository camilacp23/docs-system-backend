info:
  name: 12 List 200 (filters, default page size)
  type: http
  seq: 12
http:
  method: GET
  url: '{{baseUrl}}/users?role=DEVELOPER&status=ACTIVE&q={{runId}}'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("filters narrow the page; default pageSize is 20", function () {
          expect(res.body.total).to.equal(1);
          expect(res.body.data[0].role).to.equal("DEVELOPER");
          expect(res.body.data[0].email).to.equal("dev-" + bru.getVar("runId") + "@sandbox.local");
          expect(res.body.pageSize).to.equal(20);
        });
settings:
  encodeUrl: true
