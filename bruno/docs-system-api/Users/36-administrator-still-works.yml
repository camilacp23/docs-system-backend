info:
  name: 36 List 200 (the administrator keeps their access)
  type: http
  seq: 36
http:
  method: GET
  url: '{{baseUrl}}/users?role=ADMINISTRATOR'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the administrator is still active", function () {
          expect(res.body.data.length).to.equal(1);
          expect(res.body.data[0].status).to.equal("ACTIVE");
        });
settings:
  encodeUrl: true
