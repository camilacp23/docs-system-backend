info:
  name: 20 Deactivate 422 (RESERVED_ACCOUNT)
  type: http
  seq: 20
http:
  method: DELETE
  url: '{{baseUrl}}/users/{{reservedId}}'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code RESERVED_ACCOUNT, message and details", function () {
          expect(res.body.code).to.equal("RESERVED_ACCOUNT");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
