info:
  name: 01 Setup · administrator login 200
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
        if (res.status === 200) {
          bru.setVar("adminToken", res.body.data.accessToken);
          bru.setVar("adminId", res.body.data.user.id);
          
        }
        bru.setVar("runId", Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("a token and the run id are ready", function () {
          expect(bru.getVar("adminToken")).to.be.a("string").and.not.empty;
          expect(bru.getVar("runId")).to.be.a("string").and.not.empty;
        });
settings:
  encodeUrl: true
