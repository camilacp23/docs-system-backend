info:
  name: 08 Login reader 200
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "reader-{{runId}}@sandbox.local",
        "password": "Sandbox-Pass-2026"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
        if (res.status === 200) {
          bru.setVar("readerToken", res.body.data.accessToken);
          bru.setVar("readerId", res.body.data.user.id);
          
        }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the session belongs to the reader", function () { expect(res.body.data.user.role).to.equal("READER"); });
settings:
  encodeUrl: true
