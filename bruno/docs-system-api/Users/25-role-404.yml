info:
  name: 25 Change role 404 (no such user)
  type: http
  seq: 25
http:
  method: PUT
  url: '{{baseUrl}}/users/999999/role'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "role": "READER"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function () { expect(res.status).to.equal(404); });
        test("error body has code NOT_FOUND, message and details", function () {
          expect(res.body.code).to.equal("NOT_FOUND");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
