info:
  name: 07 Login developer 200
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "email": "dev-{{runId}}@sandbox.local",
        "password": "Sandbox-Pass-2026"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        const sc = [].concat(res.headers["set-cookie"] || []).find(function (c) { return c.startsWith("rt="); });
        if (res.status === 200) {
          bru.setVar("devToken", res.body.data.accessToken);
          bru.setVar("devId", res.body.data.user.id);
          bru.setVar("devRt", sc.split(";")[0].slice(3));
        }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the session belongs to the developer", function () {
          expect(res.body.data.user.role).to.equal("DEVELOPER");
          expect(res.body.data.user.id).to.equal(bru.getVar("devId"));
        });
settings:
  encodeUrl: true
