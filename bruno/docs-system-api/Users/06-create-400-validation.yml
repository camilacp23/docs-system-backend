info:
  name: 06 Create 400 (weak password, unknown role)
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/users'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Bad Input",
        "email": "bad-{{runId}}@sandbox.local",
        "password": "short",
        "role": "ROOT"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields names the invalid fields", function () {
          const names = res.body.details.fields.map(function (f) { return f.field; }).join(" ");
          expect(names).to.include("password");
          expect(names).to.include("role");
        });
settings:
  encodeUrl: true
