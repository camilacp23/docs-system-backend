info:
  name: 34 Update 422 (CANNOT_DEACTIVATE_SELF, PUT own status)
  type: http
  seq: 34
http:
  method: PUT
  url: '{{baseUrl}}/users/{{adminId}}'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Sandbox Administrator",
        "email": "{{adminEmail}}",
        "status": "INACTIVE"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code CANNOT_DEACTIVATE_SELF, message and details", function () {
          expect(res.body.code).to.equal("CANNOT_DEACTIVATE_SELF");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
