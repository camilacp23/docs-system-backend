info:
  name: 05 Create 409 (EMAIL_TAKEN, case-insensitive)
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/users'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Same Email",
        "email": "DEV-{{runId}}@SANDBOX.LOCAL",
        "password": "Sandbox-Pass-2026",
        "role": "READER"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function () { expect(res.status).to.equal(409); });
        test("error body has code EMAIL_TAKEN, message and details", function () {
          expect(res.body.code).to.equal("EMAIL_TAKEN");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.field is email", function () { expect(res.body.details.field).to.equal("email"); });
settings:
  encodeUrl: true
