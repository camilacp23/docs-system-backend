info:
  name: 31 Get 304 (If-None-Match matches)
  type: http
  seq: 31
http:
  method: GET
  url: '{{baseUrl}}/variables/{{varGlobalId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
    - name: If-None-Match
      value: '{{varGlobalEtag}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 304", function () { expect(res.status).to.equal(304); });
        test("no body", function () { expect(res.body === "" || res.body === undefined || res.body === null).to.equal(true); });
        test("the ETag is repeated", function () { expect(res.headers["etag"]).to.equal(bru.getVar("varGlobalEtag")); });
settings:
  encodeUrl: true
