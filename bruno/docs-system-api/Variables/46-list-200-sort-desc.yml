info:
  name: 46 List 200 (sort=-name)
  type: http
  seq: 46
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&q={{varPrefix}}&sort=-name'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("names", function () {
          const p = bru.getVar("varPrefix");
          expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["Other", "Global", "Free", "Ctx"].map(function (n) { return p + n; }));
        });
settings:
  encodeUrl: true
