info:
  name: 56 Update 403 (reader)
  type: http
  seq: 56
http:
  method: PUT
  url: '{{baseUrl}}/variables/{{varGlobalId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{varPrefix}}Global",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "description": "Denied",
        "originScreenId": null,
        "environments": [{ "environment": "DEV", "notes": "Dev note" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function () { expect(res.status).to.equal(403); });
        test("error body has code FORBIDDEN, message and details", function () {
          expect(res.body.code).to.equal("FORBIDDEN");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
settings:
  encodeUrl: true
