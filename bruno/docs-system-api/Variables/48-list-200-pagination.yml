info:
  name: 48 List 200 (page 2 of size 3)
  type: http
  seq: 48
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&q={{varPrefix}}&pageSize=3&page=2'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("second page", function () {
          expect(res.body.page).to.equal(2);
          expect(res.body.pageSize).to.equal(3);
          expect(res.body.total).to.equal(4);
          expect(res.body.data).to.have.length(1);
          expect(res.body.data[0].name).to.equal(bru.getVar("varPrefix") + "Other");
        });
settings:
  encodeUrl: true
