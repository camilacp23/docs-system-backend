info:
  name: 20 Create 400 (invalid body)
  type: http
  seq: 20
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{fixturesAppId}},
        "name": "g User",
        "dataType": "STRING",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields names name", function () {
          expect(res.body.details.fields.map(function (f) { return f.field; }).join(" ")).to.include("name");
        });
        test("details.fields names dataType", function () {
          expect(res.body.details.fields.map(function (f) { return f.field; }).join(" ")).to.include("dataType");
        });
settings:
  encodeUrl: true
