info:
  name: 41 List 200 (dataType=NUMBER)
  type: http
  seq: 41
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&q={{varPrefix}}&dataType=NUMBER'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("total", function () { expect(res.body.total).to.equal(1); });
        test("names", function () {
          const p = bru.getVar("varPrefix");
          expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["Ctx"].map(function (n) { return p + n; }));
        });
settings:
  encodeUrl: true
