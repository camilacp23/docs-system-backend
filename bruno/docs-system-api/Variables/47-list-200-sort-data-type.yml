info:
  name: '47 List 200 (sort=dataType: NUMBER before TEXT, ties by id)'
  type: http
  seq: 47
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&q={{varPrefix}}&sort=dataType'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("names", function () {
          const p = bru.getVar("varPrefix");
          expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["Ctx", "Global", "Other", "Free"].map(function (n) { return p + n; }));
        });
settings:
  encodeUrl: true
