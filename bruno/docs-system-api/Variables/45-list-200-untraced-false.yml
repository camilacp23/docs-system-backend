info:
  name: '45 List 200 (untraced=false is the same as omitting it: no filter)'
  type: http
  seq: 45
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&q={{varPrefix}}&untraced=false'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("total", function () { expect(res.body.total).to.equal(4); });
        test("names", function () {
          const p = bru.getVar("varPrefix");
          expect(res.body.data.map(function (x) { return x.name; })).to.deep.equal(["Ctx", "Free", "Global", "Other"].map(function (n) { return p + n; }));
        });
settings:
  encodeUrl: true
