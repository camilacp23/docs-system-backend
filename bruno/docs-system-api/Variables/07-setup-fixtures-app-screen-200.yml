info:
  name: 07 Setup · App (OnStart) screen of Sandbox Fixtures
  type: http
  seq: 7
http:
  method: GET
  url: '{{baseUrl}}/screens?applicationId={{fixturesAppId}}&q=App'
  headers:
    - name: Authorization
      value: 'Bearer {{varAdminToken}}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("varFxAppScreenId", res.body.data[0].id); }
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the first screen is App (OnStart)", function () {
          expect(res.body.data[0].name).to.equal("App (OnStart)");
          expect(res.body.data[0].isAppContext).to.equal(true);
        });
settings:
  encodeUrl: true
