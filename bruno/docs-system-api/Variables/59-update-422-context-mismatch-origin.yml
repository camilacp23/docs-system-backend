info:
  name: '59 Update 422 (CONTEXT_SCREEN_MISMATCH with origin: READ from Sandbox Screen B)'
  type: http
  seq: 59
http:
  method: PUT
  url: '{{baseUrl}}/variables/{{linkedVariableId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "gSandboxLinked",
        "dataType": "TEXT",
        "scope": "CONTEXT",
        "originScreenId": {{screenAId}},
        "environments": [{ "environment": "DEV" }, { "environment": "PROD" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 422", function () { expect(res.status).to.equal(422); });
        test("error body has code CONTEXT_SCREEN_MISMATCH, message and details", function () {
          expect(res.body.code).to.equal("CONTEXT_SCREEN_MISMATCH");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("message and details name the origin screen and the screen of the link", function () {
          expect(res.body.message).to.equal("gSandboxLinked belongs to Sandbox Screen A. From here you can only write it with Navigate.");
          expect(res.body.details).to.deep.equal({
            variableId: Number(bru.interpolate("{{linkedVariableId}}")),
            variable: "gSandboxLinked",
            originScreenId: Number(bru.interpolate("{{screenAId}}")),
            screen: "Sandbox Screen A",
            screenId: Number(bru.interpolate("{{screenBId}}")),
            targetScreen: "Sandbox Screen B"
          });
        });
settings:
  encodeUrl: true
