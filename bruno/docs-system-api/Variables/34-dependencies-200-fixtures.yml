info:
  name: '34 Dependencies 200 (gSandboxShared: link without the origin row, and the assignment)'
  type: http
  seq: 34
http:
  method: GET
  url: '{{baseUrl}}/variables/{{sharedVariableId}}/dependencies'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the three arrays are present", function () {
          expect(res.body.data).to.have.all.keys("variable", "originScreen", "screens", "collections", "components");
          expect(res.body.data.components).to.deep.equal([]);
        });
        test("variable and origin screen", function () {
          expect(res.body.data.variable).to.deep.equal({ id: Number(bru.interpolate("{{sharedVariableId}}")), name: "gSandboxShared" });
          expect(res.body.data.originScreen).to.deep.equal({ id: Number(bru.interpolate("{{screenAId}}")), name: "Sandbox Screen A" });
        });
        test("screens holds the READ link from B and not the origin row", function () {
          expect(res.body.data.screens).to.deep.equal([{ screen: { id: Number(bru.interpolate("{{screenBId}}")), name: "Sandbox Screen B" }, accessMode: "READ", usedIn: "Label" }]);
        });
        test("collections holds the SET assignment", function () {
          expect(res.body.data.collections).to.have.length(1);
          const c = res.body.data.collections[0];
          expect(c.id).to.be.a("number");
          expect(c.variable).to.deep.equal({ id: Number(bru.interpolate("{{sharedVariableId}}")), name: "gSandboxShared" });
          expect(c.collection).to.deep.equal({ id: Number(bru.interpolate("{{collectionId}}")), name: "colSandbox" });
          expect(c.screen).to.deep.equal({ id: Number(bru.interpolate("{{screenAId}}")), name: "Sandbox Screen A" });
          expect(c.assignmentFunction).to.equal("SET");
          expect(c.tableFunction).to.equal(null);
          expect(c.usedIn).to.equal("OnVisible");
        });
        test("the ETag is a weak validator", function () { expect(res.headers["etag"]).to.match(/^W\//); });
settings:
  encodeUrl: true
