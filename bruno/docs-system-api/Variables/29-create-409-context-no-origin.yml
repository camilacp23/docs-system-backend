info:
  name: '29 Create 409 (DUPLICATE_NAME, CONTEXT without origin: container application)'
  type: http
  seq: 29
http:
  method: POST
  url: '{{baseUrl}}/variables'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{fixturesAppId}},
        "name": "{{varPrefix}}Free",
        "dataType": "TEXT",
        "scope": "CONTEXT",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function () { expect(res.status).to.equal(409); });
        test("error body has code DUPLICATE_NAME, message and details", function () {
          expect(res.body.code).to.equal("DUPLICATE_NAME");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("message and details", function () {
          const name = bru.getVar("varPrefix") + "Free";
          expect(res.body.message).to.equal("A context variable named " + name + " already exists in Sandbox Fixtures.");
          expect(res.body.details).to.deep.equal({ field: "name", type: "context variable", name: name, application: "Sandbox Fixtures", container: "application" });
        });
settings:
  encodeUrl: true
