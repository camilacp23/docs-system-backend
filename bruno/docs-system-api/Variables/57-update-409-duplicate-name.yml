info:
  name: '57 Update 409 (DUPLICATE_NAME: rename to the other GLOBAL)'
  type: http
  seq: 57
http:
  method: PUT
  url: '{{baseUrl}}/variables/{{varGlobalId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{varPrefix}}Other",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "description": "Edited by the collection",
        "environments": [{ "environment": "DEV", "notes": "Dev note" }, { "environment": "PROD", "notes": "Added" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function () { expect(res.status).to.equal(409); });
        test("error body has code DUPLICATE_NAME, message and details", function () {
          expect(res.body.code).to.equal("DUPLICATE_NAME");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("message and details", function () {
          const name = bru.getVar("varPrefix") + "Other";
          expect(res.body.message).to.equal("A global variable named " + name + " already exists in Sandbox Fixtures.");
          expect(res.body.details).to.deep.equal({ field: "name", type: "global variable", name: name, application: "Sandbox Fixtures", container: "application" });
        });
settings:
  encodeUrl: true
