info:
  name: 54 Update 400 (applicationId in the body)
  type: http
  seq: 54
http:
  method: PUT
  url: '{{baseUrl}}/variables/{{varGlobalId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varDevToken}}'
  body:
    type: json
    data: |-
      {
        "applicationId": {{fixturesAppId}},
        "name": "{{varPrefix}}Global",
        "dataType": "TEXT",
        "scope": "GLOBAL",
        "environments": [{ "environment": "DEV" }]
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields names applicationId", function () {
          expect(res.body.details.fields.map(function (f) { return f.field; }).join(" ")).to.include("applicationId");
        });
settings:
  encodeUrl: true
