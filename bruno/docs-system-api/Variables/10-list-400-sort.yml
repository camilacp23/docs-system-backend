info:
  name: 10 List 400 (sort field not allowed)
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/variables?applicationId={{fixturesAppId}}&sort=description'
  headers:
    - name: Authorization
      value: 'Bearer {{varReaderToken}}'
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function () { expect(res.status).to.equal(400); });
        test("error body has code VALIDATION_ERROR, message and details", function () {
          expect(res.body.code).to.equal("VALIDATION_ERROR");
          expect(res.body.message).to.be.a("string").and.not.empty;
          expect(res.body).to.have.property("details");
        });
        test("details.fields names sort", function () {
          expect(res.body.details.fields.map(function (f) { return f.field; }).join(" ")).to.include("sort");
        });
settings:
  encodeUrl: true
