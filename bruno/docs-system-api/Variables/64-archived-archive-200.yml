info:
  name: 64 Archived · archive the run application 200
  type: http
  seq: 64
http:
  method: PUT
  url: '{{baseUrl}}/applications/{{varAppId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{varAdminToken}}'
  body:
    type: json
    data: |-
      {
        "name": "{{varAppName}}",
        "platform": "Power Apps",
        "status": "ARCHIVED"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () { expect(res.status).to.equal(200); });
        test("the application is archived", function () { expect(res.body.data.status).to.equal("ARCHIVED"); });
settings:
  encodeUrl: true
